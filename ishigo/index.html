  /* ===================================================================
     PARTIE
     =================================================================== */
  function lastMoveIdx() { if (!G || !G.moves.length) return -1; return G.moves[G.moves.length - 1].m; }
  function snap(b) { return { cells: Int8Array.from(b.cells), ko: b.ko, caps: b.caps.slice(), toPlay: b.toPlay }; }
  function restore(s, n) { const b = new GoBoard(n); b.cells.set(s.cells); b.ko = s.ko; b.caps = s.caps.slice(); b.toPlay = s.toPlay; return b; }
  function newGame(cfg) {
    Engine.stop();
    const n = cfg.n;
    let human = cfg.color === 'R' ? (Math.random() < 0.5 ? BLACK : WHITE) : cfg.color === 'W' ? WHITE : BLACK;
    if (cfg.handicap > 0) human = BLACK;
    const b = new GoBoard(n);
    const hs = handicapStones(n, cfg.handicap);
    for (const p of hs) b.cells[p] = BLACK;
    if (hs.length) b.toPlay = WHITE;
    G = {
      n, komi: defaultKomi(n, cfg.handicap), handicap: cfg.handicap, human, level: cfg.level, adaptive: cfg.adaptive, coach: cfg.coach,
      board: b, hist: [snap(b)], moves: [], info: [], over: false, result: null, phase: 'play', token: 1,
      thinking: false, thinkFrac: 0, analysis: null, hints: null, own: null, showBest: -1, ghost: -1, hintsUsed: 0, undos: 0,
      wrBlack: null, gone: [], newStone: -1, started: Date.now(), threats: [], humanPasses: 0
    };
    saveGame();
    S.view = { type: 'game', back: 'jouer' };
    render(true);
    nextTurn();
  }
  function saveGame() {
    if (!G) return;
    const info = G.info.map(x => x ? { facts: x.facts, verdict: x.verdict, best: x.best, bestFacts: x.bestFacts, pv: x.pv, ai: x.ai, wrB: x.wrB } : null);
    store.set('game', { n: G.n, komi: G.komi, handicap: G.handicap, human: G.human, level: G.level, adaptive: G.adaptive, coach: G.coach, moves: G.moves, info, over: G.over, result: G.result, hintsUsed: G.hintsUsed, undos: G.undos });
  }
  function loadGame(d) {
    try {
      const n = d.n, b = new GoBoard(n);
      for (const p of handicapStones(n, d.handicap)) b.cells[p] = BLACK;
      if (d.handicap > 0) b.toPlay = WHITE;
      const g = { n, komi: d.komi, handicap: d.handicap, human: d.human, level: d.level, adaptive: d.adaptive, coach: d.coach, board: b, hist: [snap(b)], moves: [], info: d.info || [], over: d.over, result: d.result, phase: d.over ? 'over' : 'play', token: 1, thinking: false, analysis: null, hints: null, own: null, showBest: -1, ghost: -1, hintsUsed: d.hintsUsed || 0, undos: d.undos || 0, wrBlack: null, gone: [], newStone: -1, threats: [], humanPasses: 0 };
      for (const mv of d.moves) { if (!b.play(mv.m, mv.c)) throw new Error('bad'); g.moves.push(mv); g.hist.push(snap(b)); }
      if (g.result && g.result.score) g.result.score.est = new Set(g.result.score.estArr || []);
      for (let i = g.info.length - 1; i >= 0; i--) if (g.info[i] && g.info[i].wrB != null) { g.wrBlack = g.info[i].wrB; break; }
      return g;
    } catch (e) { return null; }
  }
  function applyMove(m, c) {
    const before = G.board.cells.slice();
    const r = G.board.play(m, c);
    if (!r) return null;
    G.moves.push({ m, c });
    G.hist.push(snap(G.board));
    G.token++;
    G.hints = null; G.own = null; G.showBest = -1; G.ghost = -1; G.openMarks = null;
    G.newStone = m; G.gone = r.captured.map(p => ({ i: p, c: before[p] }));
    if (m >= 0) clack(r.captured.length > 0);
    return r;
  }
  function nextTurn() {
    if (!G || G.over || G.phase !== 'play') return;
    saveGame();
    if (G.board.toPlay === G.human) humanTurn();
    else aiTurn();
  }
  function humanTurn() {
    G.threats = Coach.threats(G.board, G.human, { hints: settings.coachDetail });
    renderGame();
    if (G.coach) startAnalysis();
  }
  function startAnalysis() {
    const idx = G.moves.length, token = G.token, g = G;
    const last = G.moves[idx - 1], last2 = G.moves[idx - 2];
    const a = G.analysis = { idx, stats: null, running: true, promise: null };
    a.promise = Engine.run('analyze', stateOf(G.board, last && last.m, last2 && last2.m, G.komi), COACH_P[G.n], null).then(r => {
      if (r && r.stats) a.stats = r.stats;
      a.running = false;
      if (G === g && G.token === token && r && r.stats) { G.wrBlack = g.board.toPlay === BLACK ? r.stats.winrate : 1 - r.stats.winrate; updateWinbar(); }
      return a.stats;
    });
  }
  async function getAnalysis(idx) {
    const a = G.analysis;
    if (a && a.idx === idx) {
      if (a.stats) return a.stats;
      if (a.running) { Engine.finish(); const s = await a.promise; if (s) return s; }
    }
    return null;
  }
  async function evaluateHumanMove(idx, m, c, stats) {
    const g = G;
    const best = stats.children[0];
    if (!best) return null;
    let child = stats.children.find(x => x.move === m);
    let wrP, scP;
    if (child && child.visits >= Math.max(30, best.visits * 0.06)) { wrP = child.wr; scP = child.score; }
    else {
      const s = restore(G.hist[idx + 1], G.n);
      const r = await Engine.run('analyze', stateOf(s, m, idx > 0 ? G.moves[idx - 1].m : -1, G.komi), EVAL_P[G.n]);
      if (!r || G !== g) return null;
      wrP = 1 - r.stats.winrate; scP = -r.stats.score;
    }
    const isBest = m === best.move;
    const v = Coach.verdict({ wrBest: Math.max(best.wr, wrP), wrPlayed: wrP, scoreBest: Math.max(best.score, scP), scorePlayed: scP, isBest });
    return { verdict: v, best: best.move, wrBefore: best.wr, wrAfter: wrP, pv: stats.pv.slice(0, 6) };
  }
  async function humanPlay(m) {
    if (!G || G.over || G.phase !== 'play' || G.thinking || G.board.toPlay !== G.human || G.evaluating) return;
    const before = G.board.clone();
    const reason = before.illegalReason(m, G.human);
    if (reason) { toast(reason === 'occupe' ? 'Ce point est déjà occupé.' : reason === 'ko' ? 'Interdit pour l\'instant : règle du ko. Joue ailleurs d\'abord.' : 'Interdit : ta pierre n\'aurait aucune liberté.'); return; }
    const idx = G.moves.length;
    applyMove(m, G.human);
    if (m === PASS) G.humanPasses++; else G.humanPasses = 0;
    const info = G.info[idx] = { facts: Coach.describe(before, m, G.human, { moveNumber: idx }), pending: G.coach };
    const token = G.token, g = G;
    renderGame();
    if (m === PASS && idx > 0 && G.moves[idx - 1].m === PASS) { info.pending = false; return startScoring(); }
    if (G.coach) {
      G.evaluating = true; renderGame();
      let stats = await getAnalysis(idx);
      if (G !== g || G.token !== token) return;
      if (!stats) { const r = await Engine.run('analyze', stateOf(before, idx > 0 ? G.moves[idx - 1].m : -1, idx > 1 ? G.moves[idx - 2].m : -1, G.komi), EVAL_P[G.n]); stats = r && r.stats; }
      if (G !== g || G.token !== token) return;
      if (stats) {
        const ev = await evaluateHumanMove(idx, m, G.human, stats);
        if (G !== g || G.token !== token) return;
        if (ev) {
          Object.assign(info, ev);
          info.wrB = G.human === BLACK ? ev.wrAfter : 1 - ev.wrAfter; G.wrBlack = info.wrB;
          if (ev.best !== m && ev.best >= 0) info.bestFacts = Coach.why(Coach.describe(before, ev.best, G.human, { moveNumber: idx })).slice(0, 2);
        }
      }
      info.pending = false; G.evaluating = false;
    }
    if (G.humanPasses >= 3) return startScoring();
    nextTurn();
  }
  async function aiTurn() {
    const g = G, token = G.token, idx = G.moves.length;
    const lv = LEVELS[G.level - 1];
    G.thinking = true; G.thinkFrac = 0; renderGame();
    const last = G.moves[idx - 1], last2 = G.moves[idx - 2];
    const t0 = Date.now();
    // grands plateaux : plus de simulations et de temps pour garder une force comparable
    const scale = G.n === 9 ? 1 : G.n === 13 ? 1.5 : 2;
    const tscale = G.n === 9 ? 1 : G.n === 13 ? 1.35 : 1.7;
    const params = Object.assign({}, lv, { playouts: Math.round(lv.playouts * scale), timeMs: Math.round(lv.timeMs * tscale), moveNumber: idx, opponentPassed: !!(last && last.m === PASS), allowResign: G.level >= 5 });
    const before = G.board.clone();
    let r;
    const gst = stateOf(G.board, last && last.m, last2 && last2.m, G.komi);
    gst.passChild = idx > G.n * G.n / 3 || !!(last && last.m === PASS);
    try { r = await Engine.run('genmove', gst, params, p => { if (G === g) { G.thinkFrac = p.frac; updateThink(); } }); }
    catch (e) { r = null; }
    if (G !== g || G.token !== token) return;
    if (!r) { G.thinking = false; renderGame(); return; }
    const wait = 450 - (Date.now() - t0);
    if (wait > 0) await sleep(wait);
    if (G !== g || G.token !== token) return;
    G.thinking = false;
    const aiColor = 3 - G.human;
    if (r.resign) { return finishGame({ winner: G.human, reason: 'resign', text: 'L\'IA abandonne' }); }
    let m = r.move;
    if (m >= 0 && !G.board.isLegal(m, aiColor)) m = PASS;
    applyMove(m, aiColor);
    const st = r.stats;
    const wrAI = st ? st.winrate : 0.5;
    G.wrBlack = aiColor === BLACK ? wrAI : 1 - wrAI;
    G.info[idx] = { ai: true, facts: Coach.describe(before, m, aiColor, { moveNumber: idx }), wrB: G.wrBlack, pv: st ? st.pv.slice(1, 5) : [] };
    if (m === PASS) {
      if (last && last.m === PASS) return startScoring();
      toast('L\'IA passe. Si tu passes aussi, la partie se termine et on compte les points.', 3800);
    }
    nextTurn();
  }
  function undo() {
    if (!G || G.over) return;
    if (G.phase === 'scoring') { G.phase = 'play'; G.dead = null; }
    Engine.stop(); G.thinking = false; G.evaluating = false;
    let k = G.moves.length;
    if (!k) return;
    // revenir au dernier coup humain (inclus)
    let target = -1;
    for (let i = k - 1; i >= 0; i--) if (G.moves[i].c === G.human) { target = i; break; }
    if (target < 0) return;
    G.moves.length = target; G.hist.length = target + 1; G.info.length = target;
    G.board = restore(G.hist[target], G.n);
    G.token++; G.undos++; G.hints = null; G.own = null; G.showBest = -1; G.gone = []; G.newStone = -1; G.humanPasses = 0;
    G.wrBlack = null;
    for (let i = target - 1; i >= 0; i--) if (G.info[i] && G.info[i].wrB != null) { G.wrBlack = G.info[i].wrB; break; }
    nextTurn();
  }
  async function showHint() {
    if (!G || G.over || G.board.toPlay !== G.human || G.thinking) return;
    if (G.hints) { G.hints = null; renderGame(); return; }
    const idx = G.moves.length, token = G.token, g = G;
    G.hintBusy = true; renderGame();
    let stats = await getAnalysis(idx);
    if (G !== g || G.token !== token) return;

  /* ===================================================================

  function openReview() {
    Engine.stop(); if (G) { G.thinking = false; G.evaluating = false; }
    S.view = { type: 'review', idx: G.moves.length, back: 'jouer', from: 'game' };
    render(true);

  function graphSVG() {
    const pts = [];
    let last = 0.5;
    for (let i = 0; i <= G.moves.length; i++) {
      const inf = i > 0 ? G.info[i - 1] : null;
      if (inf && inf.wrB != null) last = inf.wrB;
      pts.push(last);
    }
    const W = 300, H = 90, N = Math.max(1, pts.length - 1);
    const xy = pts.map((v, i) => [i / N * W, H - v * H]);
    const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
    const area = line + `L${W} ${H}L0 ${H}Z`;
    let marks = '';
    G.info.forEach((inf, i) => {
      if (inf && inf.verdict && (inf.verdict.key === 'mistake' || inf.verdict.key === 'blunder')) {
        const [x, y] = xy[i + 1]; marks += `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--bad)"/>`;
      }
    });
    const cx = (S.view.idx / N * W).toFixed(1);
    return `<svg class="graph" id="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Courbe des chances de gain de Noir">
      <rect width="${W}" height="${H}" fill="var(--surface-2)"/>
      <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <path d="${area}" fill="var(--ink)" fill-opacity=".14"/>
      <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      ${marks}
      <line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function viewReview() {
    const k = S.view.idx, n = G.n;
    const b = restore(G.hist[k], n);
    const mv = k > 0 ? G.moves[k - 1] : null;
    const inf = k > 0 ? G.info[k - 1] : null;
    let hints = null;
    if (inf && inf.best != null && inf.best >= 0 && inf.best !== mv.m && !inf.ai) hints = [{ i: inf.best, label: '★', tone: 'best' }];
    const board = boardSVG({ n, cells: b.cells, last: mv ? mv.m : -1, ko: b.ko, coords: settings.coords, hints });
    let coach = '';
    if (!mv) coach = `<p class="small muted" style="margin:0">Position de départ. Utilise les flèches ou la courbe pour parcourir la partie.</p>`;
    else {
      const facts = inf && inf.facts ? inf.facts : Coach.describe(restore(G.hist[k - 1], n), mv.m, mv.c, { moveNumber: k - 1 });
      const who = mv.c === G.human ? 'Ton coup' : 'Coup de l\'IA';
      coach = `<div class="head"><span class="who">${k}. ${who} · ${mv.c === BLACK ? 'Noir' : 'Blanc'} ${coordName(mv.m, n)}</span>${inf && inf.verdict ? `<span class="badge tone-${inf.verdict.tone}">${inf.verdict.label}</span>` : ''}</div>${factList(facts, 4)}`;
      if (inf && inf.verdict && inf.verdict.key !== 'best' && inf.best >= 0) coach += `<div class="small"><b>Meilleur : ${coordName(inf.best, n)}</b> (★ sur le plateau)${inf.bestFacts && inf.bestFacts[0] ? ' — ' + esc(inf.bestFacts[0].text) : ''} <span class="muted">${pct(inf.wrBefore)} → ${pct(inf.wrAfter)}</span></div>`;
      if (inf && inf.pv && inf.pv.length && mv.c === G.human && inf.verdict && inf.verdict.key !== 'best') coach += `<div class="small muted">Suite prévue après le meilleur coup : ${inf.pv.map(p => coordName(p, n)).join(', ')}</div>`;
    }
    const humanMoves = G.moves.filter(m => m.c === G.human).length;
    const analyzed = G.info.filter((x, i) => x && G.moves[i].c === G.human && x.verdict).length;
    const html = `<div class="focus wide">
      <div class="board-wrap" id="rboard">${board}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="card" style="padding:10px">${graphSVG()}<div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>Chances de gain de Noir</span><span class="num">${k}/${G.moves.length}</span></div></div>
        <input class="scrub" type="range" min="0" max="${G.moves.length}" value="${k}" data-act="scrub" aria-label="Position dans la partie">
        <div class="review-nav"><button class="btn" data-act="rv" data-v="first" aria-label="Début">${I.first}</button><button class="btn" data-act="rv" data-v="-1" aria-label="Coup précédent">${I.back}</button><button class="btn" data-act="rv" data-v="1" aria-label="Coup suivant">${I.arrow}</button><button class="btn" data-act="rv" data-v="last" aria-label="Fin">${I.last}</button></div>
        <div class="coach">${coach}</div>
        ${G.reviewBusy ? `<div class="card flat"><div class="small" style="margin-bottom:6px">Analyse de la partie… ${G.reviewProg || 0}/${humanMoves}</div><div class="progress"><i style="width:${(G.reviewProg || 0) / Math.max(1, humanMoves) * 100}%"></i></div></div>`
        : analyzed < humanMoves ? `<button class="btn block ghost" data-act="analyzeall">${I.chart} Analyser tous mes coups (${humanMoves - analyzed} restants)</button>` : ''}
        <button class="btn block ${G.over ? 'primary' : ''}" data-act="${G.over ? 'again' : 'backgame'}">${G.over ? 'Nouvelle partie' : 'Retour à la partie'}</button>
      </div></div>`;
    return [topbar('Revue de partie', `${n}×${n} · ${G.over && G.result ? G.result.text : 'en cours'}`, { back: true }), html, ''];
  }
  async function analyzeAll() {
    const g = G; G.reviewBusy = true; G.reviewProg = 0; render(false);
    for (let i = 0; i < G.moves.length; i++) {
      if (G !== g || !S.view || S.view.type !== 'review') break;
      const mv = G.moves[i];
      if (mv.c !== G.human) continue;
      const inf = G.info[i] || (G.info[i] = { facts: Coach.describe(restore(G.hist[i], G.n), mv.m, mv.c, { moveNumber: i }) });
      if (!inf.verdict) {
        const b = restore(G.hist[i], G.n);
        const r = await Engine.run('analyze', stateOf(b, i > 0 ? G.moves[i - 1].m : -1, i > 1 ? G.moves[i - 2].m : -1, G.komi), EVAL_P[G.n]);
        if (!r || G !== g || !S.view || S.view.type !== 'review') break;
        const ev = await evaluateHumanMove(i, mv.m, mv.c, r.stats);
        if (G !== g) break;
        if (ev) { Object.assign(inf, ev); inf.wrB = mv.c === BLACK ? ev.wrAfter : 1 - ev.wrAfter; if (ev.best !== mv.m && ev.best >= 0) inf.bestFacts = Coach.why(Coach.describe(b, ev.best, mv.c, { moveNumber: i })).slice(0, 2); }
      }
      G.reviewProg++;
      if (S.view && S.view.type === 'review') render(false);
    }
    if (G === g) { G.reviewBusy = false; saveGame(); if (S.view && S.view.type === 'review') render(false); }
  }

  /* ===================================================================

  function bindCoach() {

  }
  function onAct(e) {
    const el = e.currentTarget, act = el.dataset.act;
    switch (act) {
      case 'back':
        if (S.view && S.view.type === 'review' && S.view.from === 'game' && G && !G.over) { S.view = { type: 'game', back: 'jouer' }; render(true); nextTurn(); return; }
        if (S.view && S.view.type === 'game') { S.view = null; S.tab = 'jouer'; render(true); return; }
        return closeView();
      case 'resume': S.view = { type: 'game', back: S.tab }; render(true); if (!G.thinking && !G.evaluating) nextTurn(); return;
      case 'lesson': return openLesson(el.dataset.id);
      case 'problem': return openProblem(el.dataset.id);
      case 'quick': return newGame(Object.assign({}, setup, { n: 9 }));
      case 'play-first': setup.level = 1; setup.n = 9; setup.coach = true; setup.handicap = 0; setup.color = 'B'; saveAll(); return newGame(Object.assign({}, setup));
      case 'lnext': return lessonNext();
      case 'lprev': { const L = LESSONS.find(l => l.id === S.view.id); S.view.step--; T = makeTask(L.steps[S.view.step], false); return render(true); }
      case 'treset': resetTask(); return render(false);
      case 'thint': T.hintShown = true; return render(false);
      case 'tsol': {
        const m = solutionMove();
        if (m >= 0) { T.hints = [{ i: m, label: '★', tone: 'best' }]; T.hintShown = true; T.attempts++; T.feedback = { tone: 'info', html: `Une solution : <b>${coordName(m, T.n)}</b>. Joue-la pour continuer.` }; }
        return render(false);
      }
      case 'pnext': { const p = PROBLEMS.findIndex(x => x.id === S.view.id); const nx = PROBLEMS[p + 1]; if (nx) openProblem(nx.id); return; }
      case 'pfilter': S.probFilter = +el.dataset.v; return render(false);
      case 'setn': setup.n = +el.dataset.v; saveAll(); return render(false);
      case 'setcol': setup.color = el.dataset.v; saveAll(); return render(false);
      case 'hcap': { const hmax = setup.n === 9 ? 5 : 9; let h = setup.handicap + (+el.dataset.v); if (h === 1) h = +el.dataset.v > 0 ? 2 : 0; setup.handicap = Math.max(0, Math.min(hmax, h)); if (setup.handicap) setup.color = 'B'; saveAll(); return render(false); }
      case 'start': return newGame(Object.assign({}, setup));
      case 'undo': return undo();
      case 'hint': return showHint();
      case 'estimate': return estimate();
      case 'pass': return tryPass();
      case 'gmenu': return gameMenu();
      case 'showbest': { const i = +el.dataset.i; G.showBest = G.showBest === i ? -1 : i; return renderGame(); }
      case 'resumeplay': G.phase = 'play'; G.dead = null; G.token++; renderGame(); return nextTurn();
      case 'confirmscore': return confirmScore();
      case 'review': return openReview();
      case 'tocoach': { const c = $('#coachbox'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      case 'again': return newGame(Object.assign({}, setup, { n: G ? G.n : setup.n }));
      case 'backgame': S.view = { type: 'game', back: 'jouer' }; render(true); return nextTurn();
      case 'rv': { const v = el.dataset.v; let k = S.view.idx; k = v === 'first' ? 0 : v === 'last' ? G.moves.length : k + (+v); S.view.idx = Math.max(0, Math.min(G.moves.length, k)); return render(false); }
      case 'analyzeall': return analyzeAll();
      case 'moretab': S.moreTab = el.dataset.v; return render(false);
      case 'opensettings': S.moreTab = 'reglages'; return go('plus');
      case 'theme': settings.theme = el.dataset.v; saveAll(); applyTheme(); return render(false);
      case 'skin': settings.skin = el.dataset.v; saveAll(); applyTheme(); return render(false);
      case 'confirm': settings.confirm = el.dataset.v; saveAll(); return render(false);
      case 'reset': return confirmSheet('Tout réinitialiser ?', 'Leçons, problèmes, statistiques et partie en cours seront effacés de cet appareil.', 'Réinitialiser', () => { progress = { lessons: {}, problems: {}, games: [], level: 1, levelStats: {} }; setup.level = 1; G = null; store.set('game', null); saveAll(); toast('Progression réinitialisée.'); render(true); }, true);
    }
  }

      const hoverFn = i => { if (G && G.hover !== i && !G.thinking && G.phase === 'play' && G.board.toPlay === G.human && !needConfirm(G.n)) { G.hover = i; const w = $('#gboard'); if (w) { w.innerHTML = gameBoardHTML(); attachBoard(w, G.n, gameTap, hoverFn); } } };

    const gr = $('#graph');
    if (gr) {
      const pick = e => { const r = gr.getBoundingClientRect(); const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); S.view.idx = Math.round(f * G.moves.length); render(false); };
      gr.onpointerdown = pick;
    }
    if (S.view && S.view.type === 'lesson' || S.view && S.view.type === 'problem') { if (T) { T.newStone = -1; T.gone = []; } }
  }
  document.addEventListener('keydown', e => {
    if (S.view && S.view.type === 'review') {
      if (e.key === 'ArrowLeft') { S.view.idx = Math.max(0, S.view.idx - 1); render(false); }
      if (e.key === 'ArrowRight') { S.view.idx = Math.min(G.moves.length, S.view.idx + 1); render(false); }
    }
    if (e.key === 'Escape') closeSheet();
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab) go(h); });

  /* ---------- démarrage ---------- */
  function start(hot) {
    applyTheme();
    Engine.init();
    const saved = store.get('game', null);
    if (saved) G = loadGame(saved);
    const h = location.hash.slice(1);
    if (TABS.some(t => t[0] === h)) S.tab = h;
    if (hot && hot.tab) S.tab = hot.tab;
    render(true);
    try { window.claude && window.claude.hot && window.claude.hot.snapshot(() => ({ tab: S.tab })); } catch (e) { }
  }
  try {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  } catch (e) { start({}); }
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

:root {
  --bg: #eceef1;

[data-skin="kintsugi"].dark { --bg: #0c0d10; --surface: #15171c; --surface-2: #1c1f26; --ink: #ece6d8; --muted: #a39c8b; --line: #2a2c33; --accent: #d4a64a; --accent-ink: #0c0d10; --accent-soft: #2e2717; --good: #63c48c; --warn: #e2ac4e; --bad: #ef7676; --good-soft: #17301f; --warn-soft: #33270f; --bad-soft: #361a1a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); --kaya: #3d2b1f; --kaya-edge: #22170e; --grid: #d4a64a; --sb0: #5a5a60; --sb1: #18181b; --sb2: #000; --sw0: #ffffff; --sw1: #ecebe5; --sw2: #c9c7bf; --swline: rgba(0,0,0,.25); --sbline: rgba(212,166,74,.35); --stoneshadow: .5; --grain: #d4a64a; --grainop: .6; color-scheme: dark; }
[data-skin="contraste"] { --bg: #ffffff; --surface: #ffffff; --surface-2: #f0f0f0; --ink: #000000; --muted: #222222; --line: #000000; --accent: #0039b3; --accent-ink: #ffffff; --accent-soft: #dde6ff; --good: #006b2e; --warn: #8a5300; --bad: #c00000; --good-soft: #d9f2e2; --warn-soft: #fbeccc; --bad-soft: #fadcdc; --shadow: 0 0 0 1.5px #000; --kaya: #ffffff; --kaya-edge: #ffffff; --grid: #000000; --sb0: #000; --sb1: #000; --sb2: #000; --sw0: #fff; --sw1: #fff; --sw2: #fff; --swline: #000; --sbline: transparent; --stoneshadow: 0; --grain: #6b4416; --grainop: 0; color-scheme: light; }
[data-skin="contraste"].dark { --bg: #000000; --surface: #0a0a0a; --surface-2: #1a1a1a; --ink: #ffffff; --muted: #e6e6e6; --line: #ffffff; --accent: #ffd400; --accent-ink: #000000; --accent-soft: #3a3000; --good: #4cff8f; --warn: #ffc23d; --bad: #ff6b6b; --good-soft: #0c2a17; --warn-soft: #2e2200; --bad-soft: #330d0d; --shadow: 0 0 0 1.5px #fff; --kaya: #ffffff; --kaya-edge: #ffffff; --grid: #000000; --sb0: #000; --sb1: #000; --sb2: #000; --sw0: #fff; --sw1: #fff; --sw2: #fff; --swline: #000; --sbline: transparent; --stoneshadow: 0; --grain: #6b4416; --grainop: 0; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; position: relative; }
.topbar {
  display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  min-height: 56px; flex: none;
}
.topbar h1 { font-size: 20px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { font-size: 12.5px; color: var(--muted); font-family: var(--body); font-weight: 500; display: block; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center;
  cursor: pointer; color: var(--ink); flex: none;
}
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 22px; height: 22px; }
main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page { padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; }

/* barre d'onglets */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface);
  border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px;
  font-size: 11.5px; color: var(--muted); cursor: pointer; border-radius: 10px; font-weight: 500;
}
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .dot { background: var(--accent); }
.tab .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

/* cartes et éléments */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; display: inline-flex;
  align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); color: var(--ink); min-height: 46px;
  transition: transform .08s ease, background .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px;
  white-space: nowrap; cursor: pointer; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 700; cursor: pointer; font-size: 14.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
.tone-best { background: var(--accent-soft); color: var(--accent); }
.tone-good { background: var(--good-soft); color: var(--good); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-info { background: var(--surface-2); color: var(--muted); }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* accueil */
.hero { position: relative; padding: 18px 18px 20px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.hero .kanji {
  position: absolute; right: -14px; top: -30px; font-family: var(--display); font-size: 190px; line-height: 1; color: var(--ink);
  opacity: .07; pointer-events: none; user-select: none;
}
.hero h2 { font-size: 30px; line-height: 1.15; }
.hero p { margin: 6px 0 14px; color: var(--muted); max-width: 32ch; }
.seal {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-size: 19px; font-weight: 700; transform: rotate(-4deg);
}
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { font-size: 22px; font-family: var(--display); display: block; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); }
.action-card { display: flex; gap: 14px; align-items: center; cursor: pointer; border: 0; text-align: left; width: 100%; }
.action-card .mini { width: 76px; height: 76px; flex: none; }
.action-card h3 { font-size: 17px; }
.action-card .go { color: var(--muted); }

/* listes de leçons */
.level-head { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.level-head .kj { font-family: var(--display); font-size: 26px; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); }
.lesson-list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.lesson-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); width: 100%; }
.lesson-item:last-child { border-bottom: 0; }
.lesson-item:hover { background: var(--surface-2); }
.lesson-item .idx { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 2px solid var(--line); color: var(--muted); }
.lesson-item.done .idx { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lesson-item .t { font-weight: 700; }
.lesson-item .m { font-size: 13px; color: var(--muted); }

/* grille de problèmes */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px; border: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; position: relative; }
.pcard .thumb { aspect-ratio: 1; width: 100%; }
.pcard .t { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.pcard .m { font-size: 12.5px; color: var(--muted); }
.pcard .ok { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--surface); }
.pcard .ok svg { width: 14px; height: 14px; }

/* plateau */
.board-wrap { width: 100%; max-width: min(100%, calc(100dvh - 300px)); min-width: min(100%, 300px); margin: 0 auto; aspect-ratio: 1; position: relative; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.board-wrap svg { width: 100%; height: 100%; display: block; }
.board-wrap.big { max-width: min(100%, calc(100dvh - 250px)); }
.stone-new { animation: pop .16s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(.82); opacity: .5; } to { transform: scale(1); opacity: 1; } }
.stone-gone { animation: gone .3s ease-in forwards; }
@keyframes gone { to { opacity: 0; } }
.pulse { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { opacity: .35; } }

/* vue focus (leçon, problème, partie) */
.focus { display: flex; flex-direction: column; gap: 12px; padding: 0 12px 16px; }
.lesson-text { font-size: 16.5px; line-height: 1.55; }
.lesson-text b { color: var(--accent); }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.feedback svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.steps-dots { display: flex; gap: 6px; }
.steps-dots i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps-dots i.on { background: var(--accent); }
.bottom-actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding: 10px 0 calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.bottom-actions .btn { flex: 1 1 0; min-width: 0; padding: 12px 8px; white-space: nowrap; }
.bottom-actions .btn.icon { flex: 0 0 52px; }

/* partie */
.game-layout { display: flex; flex-direction: column; gap: 10px; padding: 0 10px 8px; }
.main-col { display: flex; flex-direction: column; gap: 8px; }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status { display: flex; align-items: center; gap: 8px; min-height: 30px; border: 0; background: transparent; padding: 0 4px; text-align: left; cursor: pointer; width: 100%; }
.status .st-right { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1s ease-in-out infinite; flex: none; }
.player { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 6px 10px; border: 2px solid transparent; transition: border-color .2s; position: relative; overflow: hidden; }
.player.turn { border-color: var(--accent); }
.player .stone { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.stone.b { background: radial-gradient(circle at 35% 30%, var(--sb0), var(--sb2) 70%); box-shadow: inset 0 0 0 1.5px var(--sbline); }
.stone.w { background: radial-gradient(circle at 35% 30%, var(--sw0), var(--sw2) 75%); box-shadow: inset 0 0 0 1.5px var(--swline); }
.player .nm { font-weight: 700; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .cp { font-size: 12px; color: var(--muted); }
.player .think { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .15s linear; }
.coach { background: var(--surface); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-height: 64px; }
.coach .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.coach .head .who { font-weight: 700; font-size: 15px; }
.coach ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.coach li { display: flex; gap: 8px; font-size: 14.5px; line-height: 1.45; }
.coach li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; margin-top: 8px; flex: none; background: var(--muted); }
.coach li.good::before { background: var(--good); }
.coach li.bad::before { background: var(--bad); }
.coach li.warn::before { background: var(--warn); }
.coach li.best::before { background: var(--accent); }
.coach .sep { height: 1px; background: var(--line); margin: 2px 0; }
.coach .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; cursor: pointer; font-size: 14px; }
.wrbar { height: 8px; border-radius: 99px; background: #e9e9e4; overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line); }
.wrbar i { background: #1d1d1d; height: 100%; transition: width .4s; }
.actionbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); flex: none; }
.actionbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--ink); padding: 6px 2px; border-radius: 10px; cursor: pointer; }
.actionbar button:hover { background: var(--surface-2); }
.actionbar button[disabled] { opacity: .35; pointer-events: none; }
.actionbar button[aria-pressed="true"] { color: var(--accent); }
.actionbar svg { width: 22px; height: 22px; }

/* réglages de partie */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 14.5px; }
.level-pick { display: flex; flex-direction: column; gap: 10px; }
.level-pick input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.level-name { display: flex; align-items: baseline; gap: 10px; }
.level-name b { font-family: var(--display); font-size: 22px; }
.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch-row:last-child { border-bottom: 0; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: background .2s; }
.switch span::after { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 20px; cursor: pointer; }
.stepper b { min-width: 28px; text-align: center; font-size: 18px; }

/* feuille modale */
.sheet-back { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88%; overflow-y: auto; animation: up .2s ease-out; display: flex; flex-direction: column; gap: 14px; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
.sheet h2 { font-size: 24px; }
.sheet .grab { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: -6px auto 0; }
.menu-list { display: flex; flex-direction: column; }
.menu-list button { border: 0; background: none; text-align: left; padding: 14px 4px; font-size: 16px; font-weight: 500; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); cursor: pointer; }
.menu-list button:last-child { border-bottom: 0; }
.menu-list svg { width: 22px; height: 22px; color: var(--muted); }
.result-big { font-family: var(--display); font-size: 40px; line-height: 1; }
.score-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.score-table td, .score-table th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.score-table td:first-child, .score-table th:first-child { text-align: left; }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14.5px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); animation: up .2s; text-align: center; }

/* revue */
.graph { width: 100%; height: 90px; display: block; cursor: pointer; touch-action: none; }
.review-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
input[type=range].scrub { width: 100%; accent-color: var(--accent); }

/* lexique */
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.gloss dt { font-weight: 700; font-family: var(--display); font-size: 17px; margin-top: 12px; }
.gloss dd { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

@media (min-width: 820px) and (orientation: landscape) {
  .game-layout.wide { display: grid; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; gap: 16px; padding: 0 16px 12px; }
  .game-layout.wide .side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; }
  .board-wrap { max-width: min(100%, calc(100dvh - 150px)); }
  .board-wrap.big { max-width: min(100%, calc(100dvh - 250px)); }
  .focus.wide { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; padding: 0 16px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
/* ===== Moteur de règles (côté interface) ===== */
const COLS = 'ABCDEFGHJKLMNOPQRST';
const EMPTY = 0, BLACK = 1, WHITE = 2;
const PASS = -1;

const _adjCache = {};
function adjacency(n) {
  if (_adjCache[n]) return _adjCache[n];
  const a = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const l = [];
    if (y > 0) l.push((y - 1) * n + x);
    if (x < n - 1) l.push(y * n + x + 1);
    if (y < n - 1) l.push((y + 1) * n + x);
    if (x > 0) l.push(y * n + x - 1);
    a.push(l);
  }
  _adjCache[n] = a;
  return a;
}
const _diagCache = {};
function diagonals(n) {
  if (_diagCache[n]) return _diagCache[n];
  const a = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const l = [];
    for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const X = x + dx, Y = y + dy;
      if (X >= 0 && Y >= 0 && X < n && Y < n) l.push(Y * n + X);
    }
    a.push(l);
  }
  _diagCache[n] = a;
  return a;
}

function coordName(i, n) {
  if (i === PASS || i == null || i < 0) return 'passe';
  const x = i % n, y = Math.floor(i / n);
  return COLS[x] + (n - y);
}
function parseCoord(s, n) {
  s = s.trim().toUpperCase();
  const x = COLS.indexOf(s[0]);
  const r = parseInt(s.slice(1), 10);
  if (x < 0 || isNaN(r)) return -1;
  return (n - r) * n + x;
}

class GoBoard {
  constructor(n) {
    this.n = n;
    this.cells = new Int8Array(n * n);
    this.ko = -1;
    this.toPlay = BLACK;
    this.caps = [0, 0, 0]; // caps[c] = pierres capturées PAR c
    this.adj = adjacency(n);
  }
  static fromAscii(rows, toPlay) {
    const clean = rows.map(r => r.replace(/\s+/g, ''));
    const n = clean.length;
    const b = new GoBoard(n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const ch = clean[y][x];
      if (ch === 'X' || ch === 'B') b.cells[y * n + x] = BLACK;
      else if (ch === 'O' || ch === 'W') b.cells[y * n + x] = WHITE;
    }
    b.toPlay = toPlay || BLACK;
    return b;
  }
  clone() {
    const b = new GoBoard(this.n);
    b.cells.set(this.cells);
    b.ko = this.ko; b.toPlay = this.toPlay; b.caps = this.caps.slice();
    return b;
  }
  group(i) {
    const c = this.cells[i];
    if (c === EMPTY) return null;
    const n2 = this.n * this.n;
    const seen = new Uint8Array(n2);
    const libSeen = new Uint8Array(n2);
    const stones = [i], libs = [];
    seen[i] = 1;
    for (let k = 0; k < stones.length; k++) {
      for (const q of this.adj[stones[k]]) {
        const cq = this.cells[q];
        if (cq === c && !seen[q]) { seen[q] = 1; stones.push(q); }
        else if (cq === EMPTY && !libSeen[q]) { libSeen[q] = 1; libs.push(q); }
      }

    return { color: c, stones, libs };
  }
  libCount(i) { const g = this.group(i); return g ? g.libs.length : 0; }
  /* '' si légal, sinon raison */
  illegalReason(i, c) {
    if (i === PASS) return '';
    if (this.cells[i] !== EMPTY) return 'occupe';
    if (i === this.ko) return 'ko';
    const opp = 3 - c;
    for (const q of this.adj[i]) if (this.cells[q] === EMPTY) return '';
    for (const q of this.adj[i]) {
      const cq = this.cells[q];
      if (cq === opp && this.libCount(q) === 1) return '';
      if (cq === c && this.libCount(q) > 1) return '';
    }
    return 'suicide';
  }
  isLegal(i, c) { return this.illegalReason(i, c) === ''; }
  /* joue ; renvoie {captured:[...]} ou null si illégal */
  play(i, c) {
    if (c == null) c = this.toPlay;
    if (i === PASS) { this.ko = -1; this.toPlay = 3 - c; return { captured: [] }; }
    if (this.illegalReason(i, c) !== '') return null;
    const opp = 3 - c;
    this.cells[i] = c;
    const captured = [];
    for (const q of this.adj[i]) {
      if (this.cells[q] === opp) {
        const g = this.group(q);
        if (g.libs.length === 0) for (const s of g.stones) { this.cells[s] = EMPTY; captured.push(s); }
      }
    }
    this.caps[c] += captured.length;
    this.ko = -1;
    if (captured.length === 1) {
      const g = this.group(i);
      if (g.stones.length === 1 && g.libs.length === 1) this.ko = captured[0];
    }
    this.toPlay = opp;
    return { captured };
  }
  stoneCount(c) { let k = 0; for (const v of this.cells) if (v === c) k++; return k; }
  emptyCount() { return this.stoneCount(EMPTY); }
  key() { return this.cells.join(''); }
  /* Algorithme de Benson : pierres de couleur c vivantes sans condition (même si c passe toujours).
     Renvoie { alive: Set de pierres, regions: Set de points des régions vitales (territoire sûr) } */
  passAlive(c) {
    const n2 = this.n * this.n, cells = this.cells, adj = this.adj;
    const blockOf = new Int32Array(n2).fill(-1), blocks = [];
    for (let i = 0; i < n2; i++) if (cells[i] === c && blockOf[i] < 0) {
      const g = this.group(i), id = blocks.length;
      g.stones.forEach(s => blockOf[s] = id);
      blocks.push({ stones: g.stones, libs: new Set(g.libs), alive: true });
    }
    const regOf = new Int32Array(n2).fill(-1), regions = [];
    for (let i = 0; i < n2; i++) if (cells[i] !== c && regOf[i] < 0) {
      const id = regions.length, pts = [i]; regOf[i] = id;
      const enc = new Set();
      for (let k = 0; k < pts.length; k++) for (const q of adj[pts[k]]) {
        if (cells[q] === c) enc.add(blockOf[q]);
        else if (regOf[q] < 0) { regOf[q] = id; pts.push(q); }
      }
      regions.push({ pts, enc: [...enc], ok: true });
    }
    // région vitale pour un bloc : tous ses points vides sont des libertés du bloc
    const vital = regions.map(r => r.enc.filter(b => r.pts.every(p => cells[p] !== EMPTY || blocks[b].libs.has(p))));
    let changed = true;
    while (changed) {
      changed = false;
      for (let b = 0; b < blocks.length; b++) {
        if (!blocks[b].alive) continue;
        let cnt = 0;
        for (let r = 0; r < regions.length; r++) if (regions[r].ok && vital[r].includes(b)) cnt++;
        if (cnt < 2) { blocks[b].alive = false; changed = true; }
      }
      for (const r of regions) if (r.ok && r.enc.some(b => !blocks[b].alive)) { r.ok = false; changed = true; }
    }
    const alive = new Set(), safe = new Set();
    blocks.forEach(b => { if (b.alive) b.stones.forEach(s => alive.add(s)); });
    regions.forEach((r, k) => { if (r.ok && r.enc.length && vital[k].length) r.pts.forEach(p => safe.add(p)); });
    return { alive, regions: safe };
  }
  /* Score par zone (chinois). dead: Set d'indices de pierres mortes */
  scoreArea(komi, dead) {
    const n = this.n, n2 = n * n;
    const cells = Int8Array.from(this.cells);
    let deadB = 0, deadW = 0;
    if (dead) for (const d of dead) { if (cells[d] === BLACK) deadB++; else if (cells[d] === WHITE) deadW++; cells[d] = EMPTY; }
    const owner = new Int8Array(n2); // 1 noir, 2 blanc, 0 neutre (dame)
    const seen = new Uint8Array(n2);
    let terrB = 0, terrW = 0, stonesB = 0, stonesW = 0;
    for (let i = 0; i < n2; i++) {
      if (cells[i] === BLACK) { stonesB++; owner[i] = BLACK; }
      else if (cells[i] === WHITE) { stonesW++; owner[i] = WHITE; }
    }
    for (let i = 0; i < n2; i++) {
      if (cells[i] !== EMPTY || seen[i]) continue;
      const region = [i]; seen[i] = 1;
      let touchB = false, touchW = false;
      for (let k = 0; k < region.length; k++) for (const q of this.adj[region[k]]) {
        if (cells[q] === EMPTY) { if (!seen[q]) { seen[q] = 1; region.push(q); } }
        else if (cells[q] === BLACK) touchB = true; else touchW = true;
      }
      const o = touchB && !touchW ? BLACK : touchW && !touchB ? WHITE : 0;
      for (const p of region) owner[p] = o;
      if (o === BLACK) terrB += region.length; else if (o === WHITE) terrW += region.length;
    }
    const black = stonesB + terrB, white = stonesW + terrW + komi;
    return { black, white, stonesB, stonesW, terrB, terrW, deadB, deadW, komi, owner, diff: black - white };
  }
}

/* ===== Lecteur tactique : capture / fuite (échelles, filets, snapback) ===== */
const Tactics = {
  attackCands(b, g, att, wide) {
    const set = new Set(g.libs);
    if (g.libs.length <= 2 && wide) {
      for (const l of g.libs) for (const q of b.adj[l]) if (b.cells[q] === EMPTY) set.add(q);
      // points diagonaux des pierres (filets)
      const dg = diagonals(b.n);
      if (g.libs.length <= 2) for (const s of g.stones) for (const q of dg[s]) if (b.cells[q] === EMPTY) set.add(q);
    }
    const out = [];
    for (const m of set) {
      if (!b.isLegal(m, att)) continue;
      const nb = b.clone(); nb.play(m, att);
      if (nb.cells[g.stones[0]] === EMPTY) return [m]; // capture immédiate
      const ng = nb.group(g.stones[0]);
      const my = nb.group(m);
      const score = ng.libs.length * 10 - Math.min(my.libs.length, 3);
      out.push([score, m]);
    }
    out.sort((a, b) => a[0] - b[0]);
    return out.slice(0, 8).map(x => x[1]);
  },
  defendCands(b, g, att) {
    const set = new Set(g.libs);
    const seenG = new Set();
    for (const s of g.stones) for (const q of b.adj[s]) {
      if (b.cells[q] === att && !seenG.has(q)) {
        const ag = b.group(q);
        for (const t of ag.stones) seenG.add(t);
        if (ag.libs.length === 1) set.add(ag.libs[0]);
        else if (ag.libs.length === 2 && g.libs.length <= 2) for (const l of ag.libs) set.add(l);
      }
    }
    return [...set];
  },
  /* attaquant au trait : peut-il capturer le groupe contenant tgt ? */
  capture(b, tgt, depth, ctx, ply = 0) {
    ctx.nodes++;
    const def = b.cells[tgt];
    if (def === EMPTY) return { ok: true, move: PASS };
    const att = 3 - def;
    const g = b.group(tgt);
    if (g.libs.length === 1 && b.isLegal(g.libs[0], att)) return { ok: true, move: g.libs[0] };
    if (depth <= 0 || g.libs.length > (ctx.maxLibs || 2) || ctx.nodes > ctx.max) return { ok: false };
    for (const m of this.attackCands(b, g, att, ply < 4)) {
      const nb = b.clone();
      if (!nb.play(m, att)) continue;
      const r = this.escape(nb, tgt, depth - 1, ctx, ply + 1);
      if (!r.ok) return { ok: true, move: m, reply: r.move };
      if (ctx.nodes > ctx.max) break;
    }
    return { ok: false };
  },
  /* défenseur au trait : peut-il sauver le groupe ? */
  escape(b, tgt, depth, ctx, ply = 0) {
    ctx.nodes++;
    const def = b.cells[tgt];
    if (def === EMPTY) return { ok: false };
    const att = 3 - def;
    const g = b.group(tgt);
    if (g.libs.length >= 4) return { ok: true, move: PASS };
    if (ctx.nodes > ctx.max || depth <= 0) return { ok: true, move: PASS, unsure: true };
    for (const m of this.defendCands(b, g, att)) {
      const nb = b.clone();
      if (!nb.play(m, def)) continue;
      if (nb.cells[tgt] === EMPTY) continue;
      if (nb.libCount(tgt) === 1) continue;
      const r = this.capture(nb, tgt, depth - 1, ctx, ply + 1);
      if (!r.ok) return { ok: true, move: m };
    }
    if (g.libs.length >= 2) {
      const nb = b.clone(); nb.ko = -1;
      const r = this.capture(nb, tgt, depth - 1, ctx, ply + 1);
      if (!r.ok) return { ok: true, move: PASS };
    }
    return { ok: false };
  },
  canCapture(b, tgt, maxNodes = 6000, depth = 24) {
    return this.capture(b, tgt, depth, { nodes: 0, max: maxNodes });
  },
  canEscape(b, tgt, maxNodes = 6000, depth = 24) {
    return this.escape(b, tgt, depth, { nodes: 0, max: maxNodes });
  }
};

const HANDICAP_POINTS = {
  9: [[2, 6], [6, 2], [6, 6], [2, 2], [4, 4]],
  13: [[3, 9], [9, 3], [9, 9], [3, 3], [6, 6], [3, 6], [9, 6], [6, 3], [6, 9]],
  19: [[3, 15], [15, 3], [15, 15], [3, 3], [9, 9], [3, 9], [15, 9], [9, 3], [9, 15]]
};
function handicapStones(n, h) {
  const P = HANDICAP_POINTS[n];
  if (!P || h < 2) return [];
  let sel;
  if (h <= 4) sel = P.slice(0, h);
  else if (h === 5) sel = [...P.slice(0, 4), P[4]];
  else if (h === 6) sel = [...P.slice(0, 4), P[5], P[6]];
  else if (h === 7) sel = [...P.slice(0, 4), P[5], P[6], P[4]];
  else if (h === 8) sel = [...P.slice(0, 4), P[5], P[6], P[7], P[8]];
  else sel = P.slice(0, 9);
  return sel.map(([x, y]) => y * n + x);
}
function starPoints(n) {
  if (n === 9) return [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]].map(([x, y]) => y * n + x);
  if (n === 13) return [[3, 3], [9, 3], [6, 6], [3, 9], [9, 9]].map(([x, y]) => y * n + x);
  if (n === 19) { const r = []; for (const y of [3, 9, 15]) for (const x of [3, 9, 15]) r.push(y * n + x); return r; }
  if (n === 7) return [[3, 3]].map(([x, y]) => y * n + x);
  return [];
}

if (typeof module !== 'undefined') module.exports = { COLS, EMPTY, BLACK, WHITE, PASS, adjacency, diagonals, coordName, parseCoord, GoBoard, Tactics, handicapStones, starPoints };

<script>
/* ===== Coach : explique ce que fait un coup et pourquoi il est bon ou non ===== */
const Coach = (function () {
  const plural = (k, s, p) => k > 1 ? (p || s + 's') : s;
  const pierres = k => k === 1 ? 'une pierre' : `${k} pierres`;
  const cn = (i, n) => coordName(i, n);

  function groupsAround(b, m, color) {
    const out = [], seen = new Set();
    for (const q of b.adj[m]) {
      if (b.cells[q] !== color || seen.has(q)) continue;
      const g = b.group(q);
      g.stones.forEach(s => seen.add(s));
      out.push(g);
    }
    return out;
  }
  function allGroups(b, color) {
    const out = [], seen = new Uint8Array(b.n * b.n);
    for (let i = 0; i < b.cells.length; i++) {
      if (b.cells[i] !== color || seen[i]) continue;
      const g = b.group(i); g.stones.forEach(s => seen[s] = 1); out.push(g);
    }
    return out;
  }
  function lineOf(i, n) { const x = i % n, y = (i / n) | 0; return [Math.min(x, n - 1 - x) + 1, Math.min(y, n - 1 - y) + 1]; }
  function cornerZone(n) { return n >= 19 ? 5 : n >= 13 ? 5 : 4; }
  function openingLength(n) { return n <= 9 ? 10 : n <= 13 ? 20 : 40; }
  function emptyAround(b, m, r) {
    const n = b.n, x0 = m % n, y0 = (m / n) | 0;
    let k = 0;
    for (let y = Math.max(0, y0 - r); y <= Math.min(n - 1, y0 + r); y++)
      for (let x = Math.max(0, x0 - r); x <= Math.min(n - 1, x0 + r); x++)

    return k === 0;
  }
  function cornerOf(i, n) { const x = i % n, y = (i / n) | 0; return (x < n / 2 ? 'g' : 'd') + (y < n / 2 ? 'h' : 'b'); }

    const n = b.n; let own = { 1: 0, 2: 0 };
    for (let i = 0; i < n * n; i++) {
      const v = b.cells[i]; if (!v) continue;
      const [lx, ly] = lineOf(i, n);
      if (lx <= z && ly <= z && cornerOf(i, n) === corner) own[v]++;
    }
    return own;
  }
  const POINT_NAMES = {
    '3-3': ['san-san (3-3)', 'prend le coin de façon très solide, mais donne peu d\'influence vers le centre'],
    '3-4': ['komoku (3-4)', 'équilibre entre territoire et développement le long du bord'],
    '4-4': ['hoshi (4-4)', 'rapide et tourné vers l\'influence, mais le coin reste envahissable au 3-3'],
    '3-5': ['mokuhazushi (3-5)', 'orienté vers un côté, souvent pour des stratégies d\'influence'],
    '4-5': ['takamoku (4-5)', 'haut et ambitieux, vise l\'influence']
  };

  /* --- description d'un coup --- */
  function describe(before, m, c, ctx = {}) {
    const n = before.n, opp = 3 - c;
    const facts = [];
    const add = (pri, tone, text, tag) => facts.push({ pri, tone, text, tag });
    const moveNo = ctx.moveNumber || 0;
    if (m === PASS) {
      const g = allGroups(before, opp).filter(g => g.libs.length === 1);
      add(50, 'info', 'Passe son tour : il n\'y a plus rien d\'important à jouer, ou la partie est décidée.', 'pass');
      if (g.length) add(90, 'bad', `Il restait ${pierres(g.reduce((a, g) => a + g.stones.length, 0))} adverses en atari à capturer.`, 'missed');
      return finish(facts);
    }
    const after = before.clone();
    const res = after.play(m, c);
    if (!res) return finish([{ pri: 100, tone: 'bad', text: 'Coup illégal.', tag: 'illegal' }]);
    const cap = res.captured.length;
    const myAfter = after.group(m);
    const ownBefore = groupsAround(before, m, c);
    const oppBefore = groupsAround(before, m, opp);

    if (cap > 0) {
      add(100, 'good', `Capture ${pierres(cap)}. ${cap >= 3 ? 'Gros gain : chaque pierre capturée vaut des points et libère de l\'espace.' : 'Les pierres capturées libèrent de l\'espace autour de ton groupe.'}`, 'capture');
      if (after.ko >= 0) add(95, 'info', `C'est une prise de ko : l'adversaire ne peut pas reprendre immédiatement en ${cn(after.ko, n)} ; il doit d'abord jouer une menace ailleurs.`, 'ko');
    }

    // sauvetage d'un groupe en atari
    const atariOwn = ownBefore.filter(g => g.libs.length === 1);

      const sz = atariOwn.reduce((a, g) => a + g.stones.length, 0);
      if (myAfter.libs.length >= 2) {
        const t = after.clone();
        const r = myAfter.libs.length <= 3 ? Tactics.canCapture(t, m, 2500) : { ok: false };
        if (r.ok) add(92, 'bad', `Tente de sauver ${pierres(sz)} en atari, mais le groupe reste capturable (par exemple en ${cn(r.move, n)}) : la fuite échoue.`, 'failsave');
        else add(90, 'good', `Sauve ${pierres(sz)} qui ${sz > 1 ? 'étaient' : 'était'} en atari : ${myAfter.libs.length} libertés maintenant.`, 'save');
      } else if (cap > 0) {
        add(88, 'good', `Sauve ${pierres(sz)} en capturant les pierres qui ${sz > 1 ? 'les' : 'la'} menaçaient.`, 'save');
      }

    {
      const seen = new Set();

      const r = Tactics.canEscape(t, g.stones[0], 3000);
      if (r.ok && r.move !== PASS) add(80, 'info', `Met ${pierres(g.stones.length)} en atari (dernière liberté en ${cn(g.libs[0], n)}). L'adversaire peut cependant s'échapper en ${cn(r.move, n)}.`, 'atari');
      else if (r.ok) add(80, 'info', `Met ${pierres(g.stones.length)} en atari (dernière liberté en ${cn(g.libs[0], n)}).`, 'atari');
      else add(93, 'good', `Met ${pierres(g.stones.length)} en atari, sans issue : même ${g.stones.length > 1 ? 'si elles fuient' : 'si elle fuit'} en ${cn(g.libs[0], n)}, ${g.stones.length > 1 ? 'elles seront capturées' : 'elle sera capturée'}.`, 'atariwin');
    }

    // auto-atari
    if (myAfter.libs.length === 1) {
      const sz = myAfter.stones.length;
      if (sz >= 2) add(99, 'bad', `Auto-atari : ton groupe de ${pierres(sz)} n'a plus qu'une liberté (${cn(myAfter.libs[0], n)}). L'adversaire peut le capturer tout de suite.`, 'selfatari');
      else if (cap === 0) add(70, 'warn', `Cette pierre n'a qu'une liberté et peut être capturée immédiatement. C'est parfois voulu (sacrifice, « throw-in »), sinon c'est une perte.`, 'selfatari1');
    } else if (myAfter.libs.length === 2 && myAfter.stones.length >= 2) {
      const t = after.clone();
      const r = Tactics.canCapture(t, m, 2500);
      if (r.ok) add(85, 'bad', `Ton groupe n'a que 2 libertés et peut être capturé (l'adversaire commence en ${cn(r.move, n)}).`, 'weak');
    }

    // groupes laissés en atari
    for (const g of allGroups(after, c)) {
      if (g.libs.length !== 1 || g.stones.includes(m)) continue;
      const wasAtari = before.cells[g.stones[0]] === c && before.libCount(g.stones[0]) === 1;
      if (wasAtari) add(g.stones.length >= 2 ? 91 : 60, g.stones.length >= 2 ? 'bad' : 'warn', `${g.stones.length > 1 ? 'Ton groupe de ' + pierres(g.stones.length) : 'Ta pierre'} en ${cn(g.stones[0], n)} reste en atari : l'adversaire peut ${g.stones.length > 1 ? 'le' : 'la'} capturer en ${cn(g.libs[0], n)}.`, 'ignored');
    }
    // capture manquée
    if (cap === 0) {
      let best = null;
      for (const g of allGroups(before, opp)) {
        if (g.libs.length !== 1 || !before.isLegal(g.libs[0], c)) continue;
        if (after.cells[g.stones[0]] === opp && after.libCount(g.stones[0]) === 1 && (!best || g.stones.length > best.stones.length)) best = g;
      }
      if (best && atariOpp.length < 2) add(best.stones.length >= 2 ? 75 : 55, best.stones.length >= 2 ? 'warn' : 'info', `Occasion : ${pierres(best.stones.length)} adverse${best.stones.length > 1 ? 's' : ''} en atari ${best.stones.length > 1 ? 'pouvaient' : 'pouvait'} être capturée${best.stones.length > 1 ? 's' : ''} en ${cn(best.libs[0], n)}.`, 'missed');
    }

    // connexion / coupe
    if (ownBefore.length >= 2) add(72, 'good', `Relie ${ownBefore.length} groupes en un seul : ${myAfter.libs.length} libertés, plus solide et plus difficile à attaquer.`, 'connect');
    const oppDistinct = oppBefore.filter(g => after.cells[g.stones[0]] === opp);
    if (oppDistinct.length >= 2 && cap === 0) add(70, 'good', `Coupe : les pierres adverses restent séparées en ${oppDistinct.length} groupes plus faibles.`, 'cut');

    // libertés
    if (ownBefore.length >= 1 && myAfter.libs.length >= 2) {
      const lb = Math.max(...ownBefore.map(g => g.libs.length));
      if (myAfter.libs.length >= lb + 2 && lb <= 3) add(62, 'good', `Augmente les libertés de ton groupe (${lb} → ${myAfter.libs.length}).`, 'libs');
    }
    for (const g of oppBefore) {
      if (after.cells[g.stones[0]] !== opp) continue;
      const la = after.libCount(g.stones[0]);
      if (la === 2 && g.libs.length >= 3) { add(58, 'info', `Réduit les libertés de ${pierres(g.stones.length)} adverse${g.stones.length > 1 ? 's' : ''} à 2 : elles sont sous pression.`, 'pressure'); break; }
    }

    // remplir son propre œil
    const eyeish = before.adj[m].every(q => before.cells[q] === c);
    if (eyeish && cap === 0) add(89, 'bad', `Remplit ton propre œil : un groupe a besoin de deux yeux pour vivre, cela l'affaiblit sans rien gagner.`, 'filleye');

    // forme
    const dg = diagonals(n);
    let emptyTri = false;
    {
      const x0 = m % n, y0 = (m / n) | 0;
      for (const [dx, dy] of [[0, 0], [-1, 0], [0, -1], [-1, -1]]) {
        const sx = x0 + dx, sy = y0 + dy;
        if (sx < 0 || sy < 0 || sx + 1 >= n || sy + 1 >= n) continue;
        const sq = [sy * n + sx, sy * n + sx + 1, (sy + 1) * n + sx, (sy + 1) * n + sx + 1];
        let own = 0, emp = 0;
        for (const p of sq) { if (after.cells[p] === c) own++; else if (after.cells[p] === EMPTY) emp++; }
        if (own === 3 && emp === 1) emptyTri = true;
      }
    }
    if (emptyTri && cap === 0 && !facts.some(f => f.pri >= 85)) add(52, 'warn', `Triangle vide : trois pierres en L sans quatrième. C'est une forme lourde qui gagne peu de libertés.`, 'emptytri');

    const touchesOpp = before.adj[m].some(q => before.cells[q] === opp);
    const touchesOwn = before.adj[m].some(q => before.cells[q] === c);
    let shape = null;
    if (touchesOpp) {
      // hane : pierre amie en diagonale, pierre adverse voisine des deux
      let hane = false;
      for (const s of dg[m]) {
        if (before.cells[s] !== c) continue;
        for (const o of before.adj[m]) if (before.cells[o] === opp && before.adj[s].includes(o)) hane = true;
      }
      if (hane) shape = [45, 'info', 'Hane : contourne la tête de la pierre adverse pour limiter son développement.', 'hane'];
      else if (touchesOwn) shape = [40, 'info', 'Extension au contact : prolonge ta pierre pour garder des libertés face à l\'adversaire.', 'nobi'];
      else shape = [40, 'info', 'Attache : un coup au contact qui provoque un combat local et oblige l\'adversaire à répondre.', 'contact'];
    } else if (!touchesOwn) {
      const x0 = m % n, y0 = (m / n) | 0;
      const at = (dx, dy) => { const x = x0 + dx, y = y0 + dy; return x >= 0 && y >= 0 && x < n && y < n ? before.cells[y * n + x] : -1; };
      const between = (dx, dy) => at(dx / 2, dy / 2) === EMPTY;
      if (dg[m].some(s => before.cells[s] === c)) shape = [42, 'info', 'Kosumi (diagonale) : une connexion souple, presque impossible à couper.', 'kosumi'];
      else if ([[2, 0], [-2, 0], [0, 2], [0, -2]].some(([dx, dy]) => at(dx, dy) === c && between(dx, dy))) shape = [42, 'info', 'Saut d\'un point : avance rapidement tout en restant difficile à couper.', 'jump'];
      else if ([[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].some(([dx, dy]) => at(dx, dy) === c)) shape = [40, 'info', 'Keima (pas du cavalier) : rapide, mais un peu plus facile à couper qu\'un saut.', 'keima'];
    }

    // ouverture
    const [lx, ly] = lineOf(m, n);
    const line = Math.min(lx, ly);
    const opening = moveNo < openingLength(n);
    if (opening && facts.length === 0 && line === 1) add(66, 'bad', 'Première ligne en début de partie : bien trop bas, ce coup ne contrôle presque aucun territoire.', 'line1');
    else if (!opening && line === 1 && !facts.some(f => f.pri >= 60) && moveNo < n * n * 0.45) add(50, 'warn', 'Coup sur la première ligne : il rapporte très peu, sauf pour bloquer une invasion ou en toute fin de partie.', 'line1');
    else if (opening && emptyAround(before, m, 2) && facts.length === 0) {
      const z = cornerZone(n);
      if (line === 2) add(55, 'warn', 'Deuxième ligne en ouverture : un peu bas, la pierre est vite enfermée contre le bord.', 'line2');
      else if (lx <= z && ly <= z && !(n === 9 && lx === 5 && ly === 5)) {
        const key = Math.min(lx, ly) + '-' + Math.max(lx, ly);
        const nm = POINT_NAMES[key];
        const st = stonesInCorner(before, cornerOf(m, n), z);
        if (st[opp] && !st[c]) add(48, 'info', `Approche (kakari) d'un coin adverse : conteste son territoire avant qu'il ne le ferme.`, 'kakari');
        else if (st[c] && !st[opp]) add(48, 'good', `Renforce ton coin (shimari) : il devient difficile à envahir.`, 'shimari');
        else add(48, 'good', `Prend un coin${nm ? ' au ' + nm[0] + ' : ' + nm[1] : ''}. Les coins sont les zones les plus faciles à sécuriser.`, 'corner');
      } else if (n === 9 && lx === 5 && ly === 5) add(46, 'info', 'Tengen (centre) : sur un petit plateau, le centre touche les quatre coins à la fois. Bon coup d\'influence.', 'tengen');
      else if (line >= 5) add(46, 'warn', 'Coup central : bon pour l\'influence, mais il rapporte peu de territoire tant que les coins et les bords sont libres.', 'center');
      else add(46, 'info', line === 3 ? 'Extension sur le bord à la 3ᵉ ligne : vise le territoire.' : 'Extension sur le bord à la 4ᵉ ligne : vise l\'influence vers le centre.', 'side');
    }
    if (shape && facts.filter(f => f.pri >= 60).length < 2) add(...shape);
    if (!facts.length) add(30, 'info', touchesOwn ? 'Renforce ta position et prépare la suite.' : 'Coup de développement : occupe un nouvel espace.', 'calm');
    return finish(facts);
  }
  function finish(facts) {
    facts.sort((a, b) => b.pri - a.pri);
    const seen = new Set();
    return facts.filter(f => { if (seen.has(f.tag)) return false; seen.add(f.tag); return true; });
  }

  /* --- dangers et occasions pour le joueur au trait --- */
  function threats(b, c, opts = {}) {
    const n = b.n, opp = 3 - c, out = [];
    for (const g of allGroups(b, c)) {
      if (g.libs.length === 1) {
        const r = Tactics.canEscape(b.clone(), g.stones[0], 2500);
        if (r.ok && r.move !== PASS) out.push({ tone: 'bad', pri: 90 + Math.min(g.stones.length, 9), pt: g.stones[0], move: r.move, text: `${g.stones.length > 1 ? 'Ton groupe de ' + pierres(g.stones.length) : 'Ta pierre'} en ${cn(g.stones[0], n)} est en atari.` + (opts.hints ? ` Tu peux ${g.stones.length > 1 ? 'le' : 'la'} sauver en ${cn(r.move, n)}.` : '') });
        else out.push({ tone: 'warn', pri: 70, pt: g.stones[0], text: `${g.stones.length > 1 ? 'Ton groupe de ' + pierres(g.stones.length) : 'Ta pierre'} en ${cn(g.stones[0], n)} est en atari et ne peut plus être ${g.stones.length > 1 ? 'sauvé' : 'sauvée'} : inutile d'insister, joue ailleurs.` });
      } else if (g.libs.length === 2 && g.stones.length >= 2) {
        const t = b.clone(); t.toPlay = opp; t.ko = -1;
        const r = Tactics.canCapture(t, g.stones[0], 2500);
        if (r.ok) out.push({ tone: 'warn', pri: 80, pt: g.stones[0], text: `Ton groupe de ${pierres(g.stones.length)} en ${cn(g.stones[0], n)} est menacé : l'adversaire peut le capturer en commençant par ${cn(r.move, n)}.` });
      }
    }
    if (opts.hints) for (const g of allGroups(b, opp)) {
      if (g.libs.length === 1 && b.isLegal(g.libs[0], c)) out.push({ tone: 'good', pri: 60 + Math.min(g.stones.length, 9), pt: g.stones[0], move: g.libs[0], text: `Occasion : tu peux capturer ${pierres(g.stones.length)} en ${cn(g.libs[0], n)}.` });
    }
    out.sort((a, b) => b.pri - a.pri);
    return out.slice(0, 3);
  }

  /* --- verdict de qualité à partir de l'analyse IA --- */
  const LABELS = {
    best: { label: 'Meilleur coup', tone: 'best' },
    excellent: { label: 'Excellent', tone: 'good' },
    good: { label: 'Bon coup', tone: 'good' },
    inaccuracy: { label: 'Imprécision', tone: 'warn' },
    mistake: { label: 'Erreur', tone: 'bad' },
    blunder: { label: 'Gaffe', tone: 'bad' }
  };
  function verdict(e) {
    const lossWr = Math.max(0, e.wrBest - e.wrPlayed);
    const lossPts = Math.max(0, e.scoreBest - e.scorePlayed);
    const decided = e.wrBest > 0.9 || e.wrBest < 0.1;
    let k;
    if (e.isBest) k = 'best';
    else if (decided) k = lossPts < 1.5 ? 'excellent' : lossPts < 3.5 ? 'good' : lossPts < 7 ? 'inaccuracy' : lossPts < 14 ? 'mistake' : 'blunder';
    else k = lossWr < 0.025 ? 'excellent' : lossWr < 0.06 ? 'good' : lossWr < 0.12 ? 'inaccuracy' : lossWr < 0.22 ? 'mistake' : 'blunder';
    if (!e.isBest && lossPts >= 15 && (k === 'excellent' || k === 'good' || k === 'inaccuracy')) k = 'mistake';
    if (!e.isBest && lossPts < 1 && lossWr < 0.04 && k !== 'excellent') k = 'excellent';
    return Object.assign({ key: k, lossWr, lossPts }, LABELS[k]);
  }

  function positive(facts) {
    return facts.filter(f => f.tone === 'good' || (f.tone === 'info' && f.tag !== 'missed' && f.tag !== 'pass' && f.tag !== 'calm'));
  }
  function why(facts) {
    const p = positive(facts);
    return p.length ? p : [{ tone: 'info', text: 'Coup de position : le meilleur équilibre entre territoire et sécurité selon l\'IA.', tag: 'pos' }];
  }
  return { describe, threats, verdict, LABELS, allGroups, why };
})();
if (typeof module !== 'undefined') module.exports = Coach;

      return n;
    }
    patternMoves(c, out, around) {
      if (around <= 0) return 0;
      const col = this.color, D8 = this.D8; let n = 0;
      for (let i = 0; i < 8; i++) {
        const p = around + D8[i];
        if (col[p] !== EMPTY) continue;
        if (PAT3[this.patKey(p)] && this.isLegal(p, c) && this.selfAtari(p, c) === 0) out[n++] = p;
      }
      return n;
    }
    randomMove(c) {
      const nE = this.nE;
      if (nE === 0) return 0;
      const start = rndInt(nE);
      for (let k = 0; k < nE; k++) {
        const p = this.emptyL[(start + k) % nE];
        if (!this.isLegal(p, c) || this.isEye(p, c)) continue;
        const sa = this.selfAtari(p, c);
        if (sa >= 2 || (sa === 1 && rnd() < 0.85)) continue;
        return p;
      }
      return 0;
    }
    playoutMove(c, buf) {
      let n;
      if (this.last > 0 && rnd() < 0.9) { n = this.atariMoves(c, buf); if (n) return buf[rndInt(n)]; }
      if (this.last > 0 && rnd() < 0.95) {
        n = this.patternMoves(c, buf, this.last);
        if (!n && this.last2 > 0) n = this.patternMoves(c, buf, this.last2);
        if (n) return buf[rndInt(n)];
      }
      return this.randomMove(c);
    }
    /* score zone (noir - blanc) en fin de simulation */
    score(komi, own) {
      const col = this.color, D = this.D, n = this.n, W = this.W;
      let s = 0;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const p = (y + 1) * W + x + 1, v = col[p];
        let o = 0;
        if (v === BLACK) o = 1; else if (v === WHITE) o = -1;
        else {
          let b = 0, w = 0;
          for (let k = 0; k < 4; k++) { const t = col[p + D[k]]; if (t === BLACK) b++; else if (t === WHITE) w++; }
          if (b && !w) o = 1; else if (w && !b) o = -1;
        }
        s += o;
        if (own) own[y * n + x] += o;
      }
      return s - komi;
    }
  }

  function boardFromState(st) {
    const n = st.n, b = new FB(n);
    for (let i = 0; i < n * n; i++) {
      const c = st.cells[i];
      if (c === BLACK || c === WHITE) b.play(b.pt(i % n, (i / n) | 0), c);
    }
    b.ko = st.ko >= 0 ? b.pt(st.ko % n, (st.ko / n) | 0) : 0;
    b.toPlay = st.toPlay;
    b.last = st.last >= 0 ? b.pt(st.last % n, (st.last / n) | 0) : 0;
    b.last2 = st.last2 >= 0 ? b.pt(st.last2 % n, (st.last2 / n) | 0) : 0;
    if (b.last > 0 && b.color[b.last] === EMPTY) b.last = 0;
    if (b.last2 > 0 && b.color[b.last2] === EMPTY) b.last2 = 0;
    return b;
  }

  /* --- MCTS --- */
  const PRIOR_EVEN = 10, PRIOR_SELFATARI = 10, PRIOR_CAPTURE_ONE = 15, PRIOR_CAPTURE_MANY = 30,
    PRIOR_PAT3 = 10, PRIOR_CFG = [24, 22, 8], PRIOR_EMPTYAREA = 10, RAVE_EQUIV = 3500, EXPAND_VISITS = 8;

  class Node {
    constructor(move, color) {
      this.move = move; this.color = color;
      this.v = 0; this.w = 0; this.pv = PRIOR_EVEN; this.pw = PRIOR_EVEN / 2;
      this.av = 0; this.aw = 0; this.sc = 0; this.children = null; this.k = 0;
    }
    urgency() {
      const v = this.v + this.pv;
      const e = (this.w + this.pw) / v;
      if (this.av === 0) return e;
      const re = this.aw / this.av;
      const beta = this.av / (this.av + v + v * this.av / RAVE_EQUIV);
      return beta * re + (1 - beta) * e;
    }
  }

  function emptyArea(b, p, dist) {
    const n = b.n, W = b.W, px = p % W, py = (p / W) | 0;
    for (let dy = -dist; dy <= dist; dy++) {
      const y = py + dy; if (y < 1 || y > n) continue;
      const r = dist - Math.abs(dy);
      for (let dx = -r; dx <= r; dx++) {
        const x = px + dx; if (x < 1 || x > n) continue;
        const v = b.color[y * W + x];
        if (v === BLACK || v === WHITE) return false;
      }
    }
    return true;
  }

  /* --- lecture d'échelles (pour les priorités de l'arbre) --- */
  const POOL = {};
  function poolBoard(n, d) { const a = POOL[n] || (POOL[n] = []); while (a.length <= d) a.push(new FB(n)); return a[d]; }
  /* le groupe contenant `stone` est en atari, le défenseur est au trait : est-il pris ? */
  function ladderCaptured(b, stone, depth, ctx) {
    if (++ctx.nodes > ctx.max || depth > 2 * b.n + 6) return false;
    const def = b.color[stone], att = 3 - def, r = b.rep[stone];
    if (!b.inAtari(r)) return false;
    const cands = [b.atariLib(r)];
    let s = r;
    do {
      for (let k = 0; k < 4; k++) {
        const t = s + b.D[k];
        if (b.color[t] === att) { const rr = b.rep[t]; if (b.inAtari(rr)) { const m = b.atariLib(rr); if (cands.indexOf(m) < 0) cands.push(m); } }
      }
      s = b.next[s];
    } while (s !== r);
    const libs = [0, 0, 0];
    for (const e of cands) {
      if (!b.isLegal(e, def)) continue;
      const nb = poolBoard(b.n, depth + 1); nb.copyFrom(b); nb.play(e, def);
      if (nb.color[stone] !== def) continue;
      const L = nb.libsOf(nb.rep[stone], libs);
      if (L >= 3) return false;
      if (L <= 1) continue;
      const l0 = libs[0], l1 = libs[1];
      let caught = false;
      for (const a of [l0, l1]) {
        if (!nb.isLegal(a, att)) continue;
        const nb2 = poolBoard(b.n, depth + 2); nb2.copyFrom(nb); nb2.play(a, att);
        if (nb2.color[stone] !== def) { caught = true; break; }
        if (!nb2.inAtari(nb2.rep[stone])) continue;
        if (ladderCaptured(nb2, stone, depth + 2, ctx)) { caught = true; break; }
      }
      if (!caught) return false;
    }
    return true;
  }
  const LIBS3 = [0, 0, 0];
  /* fuite d'un groupe en atari en p : 1 = réussie, -1 = échoue (échelle ou auto-atari), 0 = pas une fuite */
  function escapeQuality(b, p, c) {
    let target = 0;
    for (let j = 0; j < 4; j++) { const q = p + b.D[j]; if (b.color[q] === c && b.inAtari(b.rep[q])) { target = q; break; } }
    if (!target) return 0;
    const nb = poolBoard(b.n, 0); nb.copyFrom(b); nb.play(p, c);
    if (nb.color[target] !== c) return -1;
    const L = nb.libsOf(nb.rep[target], LIBS3);
    if (L >= 3) return 1;
    if (L <= 1) return -1;
    const ctx = { nodes: 0, max: 300 };
    const l0 = LIBS3[0], l1 = LIBS3[1];
    for (const a of [l0, l1]) {
      if (!nb.isLegal(a, 3 - c)) continue;
      const nb2 = poolBoard(b.n, 1); nb2.copyFrom(nb); nb2.play(a, 3 - c);
      if (nb2.color[target] === c && nb2.inAtari(nb2.rep[target]) && ladderCaptured(nb2, target, 2, ctx)) return -1;
    }
    return 1;
  }
  /* atari en p : 1 si le groupe adverse ne peut plus s'échapper */
  function atariWins(b, p, c) {
    const opp = 3 - c;
    let any = false;
    for (let j = 0; j < 4; j++) {
      const q = p + b.D[j];
      if (b.color[q] !== opp) continue;
      const r = b.rep[q];
      if (b.libs[r] === 0) continue;
      // le groupe a-t-il exactement 2 libertés, dont p ?
      const L = b.libsOf(r, LIBS3);
      if (L === 2 && (LIBS3[0] === p || LIBS3[1] === p)) { any = true; break; }
    }
    if (!any) return 0;
    const nb = poolBoard(b.n, 0); nb.copyFrom(b); nb.play(p, c);
    if (nb.color[p] !== c || nb.inAtari(nb.rep[p])) return 0;
    const ctx = { nodes: 0, max: 300 };
    for (let j = 0; j < 4; j++) {
      const q = p + nb.D[j];
      if (nb.color[q] === opp && nb.inAtari(nb.rep[q]) && ladderCaptured(nb, q, 0, ctx)) return nb.size[nb.rep[q]];
    }
    return 0;
  }

  function expand(node, b) {
    const c = 3 - node.color, n = b.n, W = b.W;
    const kids = [];
    const L = b.last, lx = L % W, ly = (L / W) | 0;
    const big = n >= 13;
    for (let k = 0; k < b.nE; k++) {
      const p = b.emptyL[k];
      if (!b.isLegal(p, c) || b.isEye(p, c)) continue;
      const ch = new Node(p, c);
      if (L > 0) {
        const d = Math.abs(p % W - lx) + Math.abs(((p / W) | 0) - ly);
        if (d <= 3) { ch.pv += PRIOR_CFG[d - 1]; ch.pw += PRIOR_CFG[d - 1]; }
      }
      const cap = b.capturesIfPlayed(p, c);
      if (cap === 1) { ch.pv += PRIOR_CAPTURE_ONE; ch.pw += PRIOR_CAPTURE_ONE; }
      else if (cap > 1) { ch.pv += PRIOR_CAPTURE_MANY; ch.pw += PRIOR_CAPTURE_MANY; }
      // sauver un groupe en atari (avec lecture d'échelle)
      const eq = escapeQuality(b, p, c);
      if (eq > 0) { ch.pv += PRIOR_CAPTURE_MANY; ch.pw += PRIOR_CAPTURE_MANY; }
      else if (eq < 0 && !cap) { ch.pv += PRIOR_CAPTURE_MANY; }
      // atari qui capture en échelle
      if (!cap) { const aw = atariWins(b, p, c); if (aw) { const bonus = aw > 1 ? PRIOR_CAPTURE_MANY : PRIOR_CAPTURE_ONE; ch.pv += bonus; ch.pw += bonus; } }
      if (PAT3[b.patKey(p)]) { ch.pv += PRIOR_PAT3; ch.pw += PRIOR_PAT3; }
      if (b.selfAtari(p, c)) { ch.pv += PRIOR_SELFATARI; }
      const x = p % W, y = (p / W) | 0;
      const ex = Math.min(x, n + 1 - x), ey = Math.min(y, n + 1 - y);
      const h = Math.min(ex, ey);
      if (emptyArea(b, p, 3)) {
        if (h <= 2) ch.pv += PRIOR_EMPTYAREA;
        else if (h === 3) { ch.pv += PRIOR_EMPTYAREA; ch.pw += PRIOR_EMPTYAREA; }
        else if (h === 4 && big) { ch.pv += PRIOR_EMPTYAREA; ch.pw += PRIOR_EMPTYAREA * 0.8; }
        if (big && emptyArea(b, p, 4)) {
          const hi = Math.max(ex, ey);
          if ((h === 3 || h === 4) && hi <= 5) { ch.pv += 2 * PRIOR_EMPTYAREA; ch.pw += 2 * PRIOR_EMPTYAREA; } // coins vides d'abord
          else if (h >= 5) ch.pv += PRIOR_EMPTYAREA; // centre trop tôt
        }
      } else if (h === 1) { ch.pv += 4; ch.pw += 1; }
      kids.push(ch);
    }
    if (!kids.length) kids.push(new Node(0, c));
    if (big) {
      kids.sort((a, b) => (b.pw - 0.5 * b.pv) - (a.pw - 0.5 * a.pv));
      node.k = Math.min(kids.length, WIDEN_BASE);
    }
    node.children = kids;
  }
  const WIDEN_BASE = 8;
  function widenK(v) { return WIDEN_BASE + Math.floor(4 * Math.log(1 + v / 12)); }

  function selectChild(node) {
    let best = null, bu = -1;
    const ch = node.children;
    let lim = ch.length;
    if (node.k) {
      const want = Math.min(ch.length, widenK(node.v));
      if (want > node.k) {
        // élargissement : on active les meilleurs candidats restants selon RAVE + priorité
        const tail = ch.slice(node.k).sort((a, b) => b.urgency() - a.urgency());
        for (let i = 0; i < tail.length; i++) ch[node.k + i] = tail[i];
        node.k = want;
      }
      lim = node.k;
    }
    for (let i = 0; i < lim; i++) {
      const u = ch[i].urgency() + rnd() * 1e-6;
      if (u > bu) { bu = u; best = ch[i]; }
    }
    return best;
  }

  class Search {
    constructor(st) {
      this.st = st;
      this.komi = st.komi;
      this.rootBoard = boardFromState(st);
      this.root = new Node(0, 3 - st.toPlay);
      expand(this.root, this.rootBoard);
      this.passNode = null;
      if (st.passChild && this.root.children.length && this.root.children[0].move !== 0) {
        this.passNode = new Node(0, st.toPlay);
        this.passNode.pv = PRIOR_EVEN; this.passNode.pw = PRIOR_EVEN * 0.45;
        this.root.children.unshift(this.passNode);
        if (this.root.k) this.root.k++;
      }
      this.b = new FB(st.n);
      this.amaf = new Uint8Array(this.b.N);
      this.own = new Float64Array(st.n * st.n);
      this.buf = new Int16Array(128);
      this.playouts = 0;
      this.maxLen = st.n * st.n * 3;
      this.path = [];
    }
    run(count) {
      const b = this.b, amaf = this.amaf, buf = this.buf;
      for (let it = 0; it < count; it++) {
        b.copyFrom(this.rootBoard);
        amaf.fill(0);
        const path = this.path; path.length = 0;
        let node = this.root; path.push(node);
        let passes = 0;
        while (node.children) {
          const ch = selectChild(node);
          if (ch.move === 0) passes++; else passes = 0;
          b.play(ch.move, ch.color);
          if (ch.move && !amaf[ch.move]) amaf[ch.move] = ch.color;
          node = ch; path.push(node);
          if (passes >= 2) break;
          if (!node.children && node.v >= EXPAND_VISITS) expand(node, b);
        }
        let len = 0;
        if (passes < 2) {
          while (len < this.maxLen) {
            const c = b.toPlay;
            const m = b.playoutMove(c, buf);
            if (m === 0) { if (++passes >= 2) break; } else passes = 0;
            b.play(m, c);
            if (m && !amaf[m]) amaf[m] = c;
            len++;
          }
        }
        const s = b.score(this.komi, this.own);
        const winner = s > 0 ? BLACK : WHITE;
        for (let i = 0; i < path.length; i++) {
          const nd = path[i];
          nd.v++;
          if (nd.color === winner) nd.w++;
          nd.sc += nd.color === BLACK ? s : -s;
          if (nd.children) for (const ch of nd.children) {
            if (ch.move && amaf[ch.move] === ch.color) { ch.av++; if (ch.color === winner) ch.aw++; }
          }
        }
        this.playouts++;
      }
    }
    stats() {
      const n = this.st.n;
      const kids = this.root.children.filter(k => k !== this.passNode).sort((a, b) => b.v - a.v);
      const toIdx = p => { if (p === 0) return -1; const W = n + 2; return (((p / W) | 0) - 1) * n + (p % W) - 1; };
      const children = kids.filter(k => k.v > 0).slice(0, 30).map(k => ({
        move: toIdx(k.move), visits: k.v, wr: k.w / k.v, score: k.sc / k.v,
        prior: (k.pw / k.pv)
      }));
      const pv = [];
      let nd = this.root;
      while (nd.children && pv.length < 8) {
        let best = null;
        for (const c of nd.children) if (!best || c.v > best.v) best = c;
        if (!best || best.v < 3) break;
        pv.push(toIdx(best.move)); nd = best;
      }
      const P = Math.max(1, this.playouts);
      const own = Array.from(this.own, v => Math.round((v / P) * 100) / 100);
      const best = children[0];
      return { playouts: this.playouts, children, pv, ownership: own, toPlay: this.st.toPlay,
        winrate: best ? best.wr : 0.5, score: best ? best.score : 0 };
    }
    /* coups légaux "raisonnables" (pour les niveaux faibles) */
    legalIdx() { return this.root.children.filter(k => k.move !== 0); }
  }

  /* choix final selon le niveau */
  function chooseMove(search, p) {
    const kids = search.root.children.filter(k => k.v > 0 && k.move !== 0).sort((a, b) => b.v - a.v);
    if (!kids.length) return search.root.children[0];
    const best = kids[0];
    // erreur volontaire : coup plausible au hasard (priors élevés)
    if (p.randomRate && rnd() < p.randomRate) {
      const pool = search.root.children.filter(k => k.move !== 0).sort((a, b) => (b.pw / b.pv) - (a.pw / a.pv));
      const top = pool.slice(0, Math.max(3, Math.ceil(pool.length * (p.randomBreadth || 0.3))));
      if (top.length) return top[rndInt(top.length)];
    }
    if (p.temperature > 0) {
      const minV = Math.max(2, best.v * (p.minFrac || 0.05));
      const pool = kids.filter(k => k.v >= minV);
      const ws = pool.map(k => Math.pow(k.v / best.v, 1 / p.temperature));
      let tot = ws.reduce((a, b) => a + b, 0), r = rnd() * tot;
      for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
    }
    return best;
  }

  /* estimation du score actuel (pierres mortes selon la possession) */
  function estimateNow(st, own) {
    const n = st.n, n2 = n * n;
    const cells = Int8Array.from(st.cells);
    for (let i = 0; i < n2; i++) {
      if (cells[i] === BLACK && own[i] < -0.5) cells[i] = EMPTY;
      else if (cells[i] === WHITE && own[i] > 0.5) cells[i] = EMPTY;
    }
    let s = 0;
    const seen = new Uint8Array(n2);
    for (let i = 0; i < n2; i++) {
      if (cells[i] === BLACK) s++; else if (cells[i] === WHITE) s--;
      else if (!seen[i]) {
        const reg = [i]; seen[i] = 1; let tb = false, tw = false;
        for (let k = 0; k < reg.length; k++) {
          const p = reg[k], x = p % n, y = (p / n) | 0;
          const nb = [];
          if (x > 0) nb.push(p - 1); if (x < n - 1) nb.push(p + 1); if (y > 0) nb.push(p - n); if (y < n - 1) nb.push(p + n);
          for (const q of nb) {
            if (cells[q] === EMPTY) { if (!seen[q]) { seen[q] = 1; reg.push(q); } }
            else if (cells[q] === BLACK) tb = true; else tw = true;
          }
        }
        if (tb && !tw) s += reg.length; else if (tw && !tb) s -= reg.length;

  }

  function settled(st, own, m) {
    if (m < 0) return true;
    const n = st.n, x = m % n, y = (m / n) | 0;
    const pts = [m];
    if (x > 0) pts.push(m - 1); if (x < n - 1) pts.push(m + 1); if (y > 0) pts.push(m - n); if (y < n - 1) pts.push(m + n);
    return pts.every(q => Math.abs(own[q]) > 0.85);
  }

  function hasAtari(b) {
    for (let k = 0; k < b.N; k++) { const v = b.color[k]; if ((v === BLACK || v === WHITE) && b.rep[k] === k && b.inAtari(k)) return true; }
    return false;
  }
  /* --- boucle de travail par tranches (annulable) --- */
  let currentJob = 0, finishJob = 0;
  const sleep = () => new Promise(r => setTimeout(r, 0));

  async function runJob(msg, post) {
    const id = msg.id; currentJob = id;
    const st = msg.state, p = msg.params || {};
    const search = new Search(st);
    const t0 = Date.now();
    const maxP = p.playouts || 1000, maxT = p.timeMs || 3000, minT = p.minTimeMs || 0;
    let lastPost = t0;
    while (true) {
      search.run(Math.min(64, maxP - search.playouts));
      const now = Date.now();
      if (search.playouts >= maxP && now - t0 >= minT) break;
      if (now - t0 >= maxT) break;
      if (finishJob === id && search.playouts >= 32) break;
      if (now - lastPost > 120) {
        lastPost = now;
        post({ type: 'progress', id, playouts: search.playouts, frac: Math.min(1, Math.max(search.playouts / maxP, (now - t0) / maxT)) });
      }
      await sleep();
      if (currentJob !== id) return;
    }
    if (currentJob !== id) return;
    const stats = search.stats();
    stats.ms = Date.now() - t0;
    if (msg.type === 'genmove') {
      let ch = chooseMove(search, p);
      const n = st.n, W = n + 2;
      let move = ch.move === 0 ? -1 : (((ch.move / W) | 0) - 1) * n + (ch.move % W) - 1;
      const est = estimateNow(st, stats.ownership);
      const mySign = st.toPlay === BLACK ? 1 : -1;
      let pass = move === -1;
      let resign = false;
      const moveNo = p.moveNumber || 0;
      if (p.opponentPassed && est * mySign > 0) pass = true;
      // passer si cela ne coûte rien (comparaison avec le meilleur coup)
      const pn = search.passNode, bestK = search.root.children.filter(k => k.move !== 0).sort((a, b) => b.v - a.v)[0];
      if (!pass && pn && bestK && pn.v >= 100 && bestK.v > 0) {
        const sp = pn.sc / pn.v, sb = bestK.sc / bestK.v, wp = pn.w / pn.v, wb = bestK.w / bestK.v;
        if (sp >= sb - 0.3 && wp >= wb - 0.02 && !hasAtari(search.rootBoard)) pass = true;
      }
      if (p.allowResign && stats.winrate < 0.03 && est * mySign < -Math.max(15, n * 1.5) && moveNo > n * n / 3 && stats.playouts > 1500) resign = true;
      post({ type: 'move', id, move: pass ? -1 : move, resign, stats, estimate: est });
    } else {
      stats.estimate = estimateNow(st, stats.ownership);
      post({ type: 'analysis', id, stats });
    }
  }

  function handle(msg, post) {
    if (msg.type === 'stop') { currentJob = -1; return; }
    if (msg.type === 'finish') { finishJob = msg.id; return; }
    if (msg.type === 'genmove' || msg.type === 'analyze') runJob(msg, post).catch(e => post({ type: 'error', id: msg.id, error: String(e && e.stack || e) }));
  }

  const api = { FB, Search, boardFromState, chooseMove, estimateNow, handle, PAT3 };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.GoAI = api;
  if (typeof WorkerGlobalScope !== 'undefined' && root instanceof WorkerGlobalScope) {
    root.onmessage = e => handle(e.data, m => root.postMessage(m));
  }
})(typeof self !== 'undefined' ? self : globalThis);

      const y = (ev.clientY - r.top) / r.height * vb.height + vb.y;
      const ix = Math.round(x), iy = Math.round(y);
      if (ix < 0 || iy < 0 || ix >= n || iy >= n) return -1;
      if (Math.abs(x - ix) > 0.62 || Math.abs(y - iy) > 0.62) return -1;
      return iy * n + ix;
    };
    let down = null;
    wrap.onpointerdown = e => { down = { x: e.clientX, y: e.clientY }; };
    wrap.onpointerup = e => {
      if (!down) return;
      const d = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
      if (d > 18) return;
      const i = pt(e); if (i >= 0) onTap(i, e.pointerType);
    };
    if (onHover) {
      wrap.onpointermove = e => { if (e.pointerType === 'mouse') onHover(pt(e)); };
      wrap.onpointerleave = () => onHover(-1);
    }
  }

  /* ---------- moteur IA (worker) ---------- */
  const Engine = {
    worker: null, cur: null, nextId: 1,
    init() {

        this.worker = new Worker(url);
        this.worker.onmessage = e => this.onMsg(e.data);
        this.worker.onerror = () => { this.worker = null; };
      } catch (e) { this.worker = null; }
    },
    post(msg) {
      if (this.worker) { try { this.worker.postMessage(msg); return; } catch (e) { this.worker = null; } }

    },
    onMsg(m) {
      const job = this.cur;
      if (!job || job.id !== m.id) return;

      if (m.type === 'error') { console.error(m.error); job.reject(new Error(m.error)); return; }
      job.resolve(m);
    },
    run(type, state, params, onProgress) {
      this.stop();

    stop() {

  /* ---------- moteur de tâches (leçons et problèmes) ---------- */
  function makeTask(item, isProblem) {
    const rows = item.board;
    const b = GoBoard.fromAscii(rows, item.toPlay === 'W' ? WHITE : BLACK);
    if (item.ko) b.ko = parseCoord(item.ko, b.n);
    const task = isProblem ? item : item.task;
    const n = b.n;
    const marks = {};
    if (item.marks) for (const k in item.marks) marks[parseCoord(k, n)] = item.marks[k];
    return {
      item, isProblem, task, board: b, start: b.clone(), n, marks, baseMarks: Object.assign({}, marks), user: b.toPlay,
      tapped: new Set(), solved: !task, failed: false, feedback: null, last: -1, busy: false, newStone: -1, gone: [],
      hintShown: false, attempts: 0, hints: null
    };
  }
  function resetTask() {
    T.board = T.start.clone(); T.marks = Object.assign({}, T.baseMarks); T.tapped = new Set(); T.solved = false; T.failed = false;
    T.feedback = null; T.last = -1; T.busy = false; T.newStone = -1; T.gone = []; T.hints = null;
  }
  function taskPlay(i, c) {
    const before = T.board.cells.slice();
    const r = T.board.play(i, c);
    if (!r) return null;
    T.last = i; T.newStone = i;
    T.gone = r.captured.map(p => ({ i: p, c: before[p] }));
    clack(r.captured.length > 0);
    return r;
  }
  function taskSuccess(msg) {
    T.solved = true; T.failed = false;
    T.feedback = { tone: 'good', html: msg || 'Bravo !' };
    if (T.isProblem) {
      const p = progress.problems[T.item.id] || {};
      if (!p.solved) { p.solved = true; p.firstTry = T.attempts === 0 && !T.hintShown; }
      progress.problems[T.item.id] = p; saveAll();
    }
  }
  function taskFail(msg, keep) {
    T.failed = true; T.attempts++;
    T.feedback = { tone: 'bad', html: msg };
    if (T.isProblem) { const p = progress.problems[T.item.id] || {}; p.tries = (p.tries || 0) + 1; progress.problems[T.item.id] = p; saveAll(); }
    if (!keep) { T.busy = true; setTimeout(() => { if (!T || !T.failed) return; T.board = T.start.clone(); T.last = -1; T.gone = []; T.busy = false; T.newStone = -1; renderTaskBoard(); }, 1400); }
  }
  const okMsg = () => T.isProblem ? (T.item.why ? `<b>Bien joué !</b> ${esc(T.item.why)}` : '<b>Bien joué !</b>') : (T.item.ok || 'Bravo !');
  function bestDefense(b, t) {
    const def = b.cells[t], att = 3 - def;
    const g = b.group(t);
    const r = Tactics.canEscape(b.clone(), t, 6000, 24);
    if (r.ok && r.move !== PASS) return r.move;
    let best = -1, bl = -1;
    for (const m of Tactics.defendCands(b, g, att)) {
      const nb = b.clone(); if (!nb.play(m, def)) continue;
      if (!nb.cells[t]) continue;
      const l = nb.libCount(t); if (l > bl) { bl = l; best = m; }
    }
    return best;
  }
  async function taskTap(i) {
    if (!T || T.busy || T.solved) return;
    const t = T.task, b = T.board, n = T.n, c = T.user;
    const name = coordName(i, n);
    T.gone = []; T.newStone = -1;
    if (t.type === 'tap') {
      const targets = t.targets.map(s => parseCoord(s, n));
      if (targets.includes(i)) {
        T.tapped.add(i); T.marks[i] = 'okc';
        if (T.tapped.size === targets.length) taskSuccess(T.item.ok);
        else T.feedback = { tone: 'info', html: `Oui. Encore ${targets.length - T.tapped.size} à trouver.` };
      } else {
        T.marks[i] = 'bad';
        T.feedback = { tone: 'bad', html: b.cells[i] ? 'C\'est une pierre : touche les intersections <b>vides</b> voisines.' : 'Ce point n\'est pas relié directement à la pierre par une ligne.' };
        setTimeout(() => { if (T && T.marks[i] === 'bad') { delete T.marks[i]; renderTaskBoard(); } }, 900);
      }
      return renderTask();
    }
    if (t.type === 'illegal') {
      const target = parseCoord(t.target, n);
      const reason = b.illegalReason(i, c);
      if (i === target && reason) { taskSuccess(T.item.ok); T.marks[i] = 'x'; }
      else if (reason) T.feedback = { tone: 'info', html: 'Ce point est interdit aussi, mais essaie le point marqué.' };
      else T.feedback = { tone: 'info', html: 'Ce coup est autorisé. Essaie le point marqué d\'une croix.' };
      return renderTask();
    }
    const reason = b.illegalReason(i, c);
    if (reason) {
      T.feedback = { tone: 'bad', html: reason === 'occupe' ? 'Ce point est déjà occupé.' : reason === 'ko' ? 'Interdit : règle du ko. Il faut d\'abord jouer ailleurs.' : 'Interdit : ta pierre n\'aurait aucune liberté (suicide).' };
      return renderTask();
    }
    if (t.type === 'any') { taskPlay(i, c); taskSuccess(T.item.ok); return renderTask(); }
    if (t.type === 'moves') {
      const ok = t.ok.map(s => parseCoord(s, n));
      taskPlay(i, c);
      if (ok.includes(i)) taskSuccess(okMsg());
      else taskFail((t.wrong && t.wrong[name]) || t.wrongDefault || 'Ce n\'est pas le coup attendu. Réessaie.');
      return renderTask();
    }
    if (t.type === 'tree') {
      taskPlay(i, c);
      const node = t.tree[name];
      if (node && node.ok) taskSuccess(okMsg());
      else if (t.refute && t.refute[name]) {
        renderTask(); T.busy = true; await sleep(450);
        if (!T) return;
        taskPlay(parseCoord(t.refute[name], n), 3 - c); T.busy = false;
        taskFail(`${esc(t.wrongDefault || 'Ce coup ne marche pas.')} (réponse en ${t.refute[name]})`, true);
      } else taskFail(esc(t.wrongDefault || 'Ce coup ne fonctionne pas. Réessaie.'));
      return renderTask();
    }
    const tgt = parseCoord(t.target, n);
    if (t.type === 'atari') {
      taskPlay(i, c);
      if (b.cells[tgt] && b.libCount(tgt) === 1) taskSuccess(okMsg());
      else taskFail(b.cells[tgt] ? `Après ce coup, la pierre a encore ${b.libCount(tgt)} libertés. Il faut la réduire à une seule.` : 'Tu l\'as même capturée ! Ici on voulait juste l\'atari.');
      return renderTask();
    }
    if (t.type === 'capture') {
      const immediate = T.start.libCount(tgt) === 1 && b.key() === T.start.key();
      taskPlay(i, c);
      if (!b.cells[tgt]) { taskSuccess(okMsg()); return renderTask(); }
      if (immediate) { taskFail('Ce coup ne capture pas. Cherche la dernière liberté du groupe.'); return renderTask(); }
      const esc2 = Tactics.canEscape(b.clone(), tgt, 8000, 24);
      renderTask();
      T.busy = true; await sleep(420); if (!T) return; T.busy = false;
      const reply = bestDefense(b, tgt);
      if (esc2.ok) {
        if (reply >= 0) taskPlay(reply, 3 - c);
        taskFail(`L'adversaire s'échappe${reply >= 0 ? ' en ' + coordName(reply, n) : ''} : il a maintenant assez de libertés. Réessaie.`, true);
      } else {
        if (reply >= 0) { taskPlay(reply, 3 - c); T.feedback = { tone: 'info', html: `Blanc tente ${coordName(reply, n)}. Continue la poursuite !` }; }
        else T.feedback = { tone: 'info', html: 'Continue : le groupe ne peut plus s\'échapper.' };
        if (!b.cells[tgt]) taskSuccess(okMsg());
      }
      return renderTask();
    }
    if (t.type === 'save') {
      taskPlay(i, c);
      const alive = b.cells[tgt] && b.libCount(tgt) >= 2 && !Tactics.canCapture(b.clone(), tgt, 8000, 24).ok;
      if (alive) { taskSuccess(okMsg()); return renderTask(); }
      renderTask();
      T.busy = true; await sleep(420); if (!T) return; T.busy = false;
      const r = b.cells[tgt] ? Tactics.canCapture(b.clone(), tgt, 8000, 24) : { ok: false };
      if (r.ok && r.move >= 0) taskPlay(r.move, 3 - c);
      taskFail(`Pas encore sauvé : l'adversaire peut continuer en ${r.move >= 0 ? coordName(r.move, n) : '…'} et capturer. Réessaie.`, true);
      return renderTask();
    }
  }
  function solutionMove() {
    const t = T.task, n = T.n, b = T.start;
    if (!t) return -1;
    if (t.type === 'moves') return parseCoord(t.ok[0], n);
    if (t.type === 'tree') return parseCoord(Object.keys(t.tree)[0], n);
    if (t.type === 'tap') { const left = t.targets.map(s => parseCoord(s, n)).filter(p => !T.tapped.has(p)); return left[0]; }
    if (t.type === 'illegal') return parseCoord(t.target, n);
    const tgt = parseCoord(t.target, n);
    const cur = T.board;
    for (let i = 0; i < n * n; i++) {
      if (!cur.isLegal(i, T.user)) continue;
      const nb = cur.clone(); nb.play(i, T.user);
      if (t.type === 'capture' && (!nb.cells[tgt] || !Tactics.canEscape(nb, tgt, 8000, 24).ok)) return i;
      if (t.type === 'save' && nb.cells[tgt] && nb.libCount(tgt) > 1 && !Tactics.canCapture(nb, tgt, 8000, 24).ok) return i;
      if (t.type === 'atari' && nb.cells[tgt] && nb.libCount(tgt) === 1) return i;
    }
    return -1;
  }
  function taskBoardHTML() {
    return boardSVG({ n: T.n, cells: T.board.cells, last: T.last, ko: T.board.ko, marks: T.marks, coords: settings.coords && !T.item.noCoords, newStone: T.newStone, gone: T.gone, terr: T.item.showTerritory ? T.board.scoreArea(7).owner : null, hints: T.hints });
  }
  function renderTaskBoard() {
    const w = $('#tboard'); if (!w || !T) return;
    w.innerHTML = taskBoardHTML();
    attachBoard(w, T.n, i => taskTap(i));
    const fb = $('#tfeedback'); if (fb) fb.outerHTML = feedbackHTML();
  }
  function feedbackHTML() {
    const f = T.feedback;
    if (!f) {

  }
